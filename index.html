<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KGR Group — ระบบจัดการ Order ทอง (Prototype v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   KGR GROUP — DESIGN TOKENS
   ============================================================ */
:root{
  /* Brand — from logo */
  --header-bg:#002060;
  --header-fg:#FFFFFF;
  --btn-primary:#0056FF;
  --btn-primary-fg:#FFFFFF;
  --btn-primary-hover:#0044CC;
  --table-head-bg:#003399;
  --table-head-fg:#FFFFFF;
  --text-primary:#001A33;
  --card-highlight-bg:#E6F0FF;
  --page-bg:#FFFFFF;

  /* Extension neutrals (added for consistency, not from logo) */
  --text-secondary:#5C6B7A;
  --border:#DADFEE;
  --border-strong:#B7BFDA;
  --zebra:#F5F7FA;
  --sidebar-bg:#FFFFFF; /* White sidebar — KGR blue logo pops naturally */
  --sidebar-active:#0056FF;
  --sidebar-fg:#3B4C6B;
  --sidebar-fg-active:#FFFFFF;

  /* Status — fixed triads, never mixed */
  --st-progress-bg:#FDE8D8; --st-progress-fg:#8A3E00; --st-progress-bd:#F0B37E;
  --st-done-bg:#DCF3E3;     --st-done-fg:#1E7E34;     --st-done-bd:#8FD4A3;
  --st-hold-bg:#FBE0DF;     --st-hold-fg:#A31E1B;     --st-hold-bd:#EFA3A0;
  /* Status — extensions (documented separately in spec) */
  --st-info-bg:#EEF1F6;     --st-info-fg:#3B4758;     --st-info-bd:#D3D9E6;
  --st-sched-bg:#EDE7FB;    --st-sched-fg:#5B21B6;    --st-sched-bd:#C9B8F0;

  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(0,26,51,0.06);
  --shadow-md:0 4px 16px rgba(0,32,96,0.10);
  --shadow-lg:0 12px 40px rgba(0,32,96,0.18);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Sarabun', sans-serif;
  background:var(--page-bg);
  color:var(--text-primary);
  font-size:18px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num, .mono{
  font-family:'IBM Plex Mono','IBM Plex Sans Thai',monospace;
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.01em;
}
h1,h2,h3,h4{margin:0; font-weight:700;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}

/* ============================================================
   LAYOUT
   ============================================================ */
.app{display:flex; min-height:100vh;}

.sidebar{
  width:236px; flex-shrink:0;
  background:var(--sidebar-bg);
  color:var(--sidebar-fg);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  border-right:1px solid #DADFEE;
  box-shadow:2px 0 12px rgba(0,26,77,0.07);
}
.sidebar-logo{
  display:flex; align-items:center; justify-content:center;
  padding:22px 20px 18px;
  background:#FFFFFF;
  border-bottom:1px solid #DADFEE;
}
.sidebar-logo img{
  height:56px; width:auto; display:block;
}

.sidebar-nav{flex:1; padding:14px 10px; overflow-y:auto;}
.sidebar-section-label{
  font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  color:#9DAEC8; padding:10px 10px 6px; letter-spacing:.08em;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-radius:8px; margin-bottom:2px;
  font-size:13.5px; font-weight:500; color:var(--sidebar-fg);
  cursor:pointer; user-select:none;
  transition:background .12s ease, color .12s ease;
  position:relative;
}
.nav-item svg{width:17px; height:17px; flex-shrink:0; opacity:.8;}
.nav-item:hover{background:#E6F0FF; color:#002060;}
.nav-item:hover svg{opacity:1;}
.nav-item.active{background:var(--sidebar-active); color:#fff; box-shadow:0 2px 8px rgba(0,86,255,0.25);}
.nav-item.active svg{opacity:1;}
.nav-item .badge-count{
  margin-left:auto; background:#E6F0FF; color:#0044CC;
  font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:20px;
}
.nav-item.active .badge-count{background:rgba(255,255,255,0.25); color:#fff;}

.sidebar-foot{
  padding:12px; border-top:1px solid #DADFEE;
  display:flex; align-items:center; gap:9px;
  background:#F5F8FF;
}
.avatar-chip{
  width:32px; height:32px; border-radius:50%; background:var(--btn-primary);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; flex-shrink:0;
}
.sidebar-foot .who{font-size:12px; line-height:1.3;}
.sidebar-foot .who b{display:block; color:#001A33; font-weight:600; font-size:12.5px;}
.sidebar-foot .who span{color:#5C6B7A; font-size:11px;}

.main{flex:1; min-width:0; display:flex; flex-direction:column; background:#FAFBFD;}

.topbar{
  height:56px; background:var(--header-bg); color:var(--header-fg);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; flex-shrink:0; position:sticky; top:0; z-index:30;
  box-shadow:var(--shadow-sm);
}
.breadcrumb{font-size:12.5px; color:rgba(255,255,255,0.7); display:flex; align-items:center; gap:6px;}
.breadcrumb b{color:#fff; font-weight:600;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.era-toggle{
  font-size:11.5px; background:rgba(255,255,255,0.12); color:#fff;
  padding:4px 10px; border-radius:20px; display:flex; align-items:center; gap:6px;
}
.era-toggle b{font-weight:700;}
.topbar-user{font-size:12.5px; color:rgba(255,255,255,0.85); display:flex; align-items:center; gap:8px;}

.content{padding:28px 32px 64px; flex:1; max-width:1180px; margin:0 auto; width:100%;}
.page{display:none; animation:fadeIn .18s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; gap:16px; flex-wrap:wrap;}
.page-head h1{font-size:25px; font-weight:700; color:var(--text-primary);}
.page-head .desc{font-size:15px; color:var(--text-secondary); margin-top:4px;}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  border-radius:12px; padding:13px 22px; font-size:16px; font-weight:600;
  min-height:50px;
  border:1px solid transparent; transition:all .12s ease; white-space:nowrap;
}
.btn svg{width:18px; height:18px;}
.btn-primary{background:var(--btn-primary); color:var(--btn-primary-fg);}
.btn-primary:hover{background:var(--btn-primary-hover);}
.btn-secondary{background:#fff; color:var(--text-primary); border-color:var(--border-strong);}
.btn-secondary:hover{background:var(--zebra); border-color:var(--btn-primary);}
.btn-ghost{background:transparent; color:var(--btn-primary); border-color:transparent; padding:9px 10px;}
.btn-ghost:hover{background:var(--card-highlight-bg);}
.btn-danger-ghost{background:transparent; color:var(--st-hold-fg); border-color:var(--st-hold-bd);}
.btn-danger-ghost:hover{background:var(--st-hold-bg);}
.btn-sm{padding:9px 15px; font-size:14px; border-radius:9px; min-height:40px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.icon-btn{
  width:44px; height:44px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border-strong); background:#fff; color:var(--text-secondary);
}
.icon-btn:hover{border-color:var(--btn-primary); color:var(--btn-primary); background:var(--card-highlight-bg);}
.icon-btn svg{width:19px; height:19px;}

/* ============================================================
   FORM ELEMENTS
   ============================================================ */
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:14px; font-weight:600; color:var(--text-primary);}
.field label .req{color:var(--st-hold-fg); margin-left:2px;}
.field .hint{font-size:13px; color:var(--text-secondary);}
input[type=text], input[type=date], input[type=number], select, textarea{
  font-family:inherit; font-size:16px; color:var(--text-primary);
  border:1px solid var(--border-strong); border-radius:10px; padding:13px 14px;
  min-height:50px;
  background:#fff; width:100%; transition:border-color .12s;
}
input.num-input{font-family:'IBM Plex Mono'; text-align:right;}
input:focus, select:focus, textarea:focus{outline:none; border-color:var(--btn-primary); box-shadow:0 0 0 3px rgba(0,86,255,0.12);}
input:disabled, .input-locked{background:var(--zebra); color:var(--text-secondary); border-color:var(--border); cursor:not-allowed;}
.search-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.search-row input{max-width:280px;}
.search-hint{font-size:11px; color:var(--text-secondary); display:flex; align-items:center; gap:6px;}
.search-hint svg{width:15px; height:15px; flex-shrink:0; stroke:var(--text-secondary);}

/* ============================================================
   CARDS / SURFACES
   ============================================================ */
.card{
  background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
}
.card-pad{padding:20px;}
.card-highlight{background:var(--card-highlight-bg); border-color:#C9DBFF;}
.stat-card{
  background:var(--card-highlight-bg); border:1px solid #C9DBFF; border-radius:var(--radius-md);
  padding:14px 16px;
}
.stat-card .label{font-size:14px; color:#0B3F94; font-weight:600; margin-bottom:8px;}
.stat-card .value{font-size:32px; font-weight:700; color:var(--text-primary);}
.stat-card .value .unit{font-size:14px; font-weight:500; color:var(--text-secondary); margin-left:4px;}

/* ============================================================
   TABLES
   ============================================================ */
.table-wrap{background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;}
table{width:100%; border-collapse:collapse;}
thead th{
  background:var(--table-head-bg); color:var(--table-head-fg);
  font-size:15px; font-weight:700; text-align:left; padding:14px 16px;
  position:sticky; top:0;
}
thead th.num, thead th.right{text-align:right;}
tbody td{padding:16px; font-size:17px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:nth-child(even){background:var(--zebra);}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--card-highlight-bg);}
td.num, th.num{font-family:'IBM Plex Mono'; text-align:right; font-variant-numeric:tabular-nums;}
td.right{text-align:right;}
.cell-primary{font-weight:600; color:var(--text-primary);}
.cell-sub{font-size:13px; color:var(--text-secondary); margin-top:1px;}
.table-actions{display:flex; gap:6px; justify-content:flex-end;}
.table-foot{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; font-size:12px; color:var(--text-secondary); border-top:1px solid var(--border);}
.pager{display:flex; gap:4px; align-items:center;}
.pager button{width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:#fff; font-size:12px;}
.pager button.active{background:var(--btn-primary); color:#fff; border-color:var(--btn-primary);}
.empty-row td{text-align:center; padding:40px 16px; color:var(--text-secondary); font-size:13px;}

/* ============================================================
   BADGES — status (fixed triads) + tabs
   ============================================================ */
.badge{
  display:inline-flex; align-items:center; gap:6px;
  font-size:15px; font-weight:700; padding:5px 14px; border-radius:999px;
  border:1px solid transparent; white-space:nowrap;
}
.badge::before{content:''; width:7px; height:7px; border-radius:50%; background:currentColor;}
.badge-progress{background:var(--st-progress-bg); color:var(--st-progress-fg); border-color:var(--st-progress-bd);}
.badge-done{background:var(--st-done-bg); color:var(--st-done-fg); border-color:var(--st-done-bd);}
.badge-hold{background:var(--st-hold-bg); color:var(--st-hold-fg); border-color:var(--st-hold-bd);}
.badge-info{background:var(--st-info-bg); color:var(--st-info-fg); border-color:var(--st-info-bd);}
.badge-sched{background:var(--st-sched-bg); color:var(--st-sched-fg); border-color:var(--st-sched-bd);}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap;}
.tab{
  padding:14px 18px; font-size:15px; font-weight:600; color:var(--text-secondary);
  border-bottom:3px solid transparent; cursor:pointer; display:flex; align-items:center; gap:7px;
  margin-bottom:-1px;
}
.tab:hover{color:var(--text-primary);}
.tab.active{color:var(--btn-primary); border-bottom-color:var(--btn-primary);}
.tab .count{background:var(--zebra); color:var(--text-secondary); font-size:10.5px; font-weight:700; padding:1px 6.5px; border-radius:20px;}
.tab.active .count{background:var(--card-highlight-bg); color:var(--btn-primary);}

/* subtab pill style (used inside a page, e.g. Stock) */
.pills{display:flex; gap:8px; margin-bottom:16px;}
.pill{padding:10px 18px; border-radius:20px; font-size:14px; font-weight:600; border:1px solid var(--border-strong); color:var(--text-secondary); cursor:pointer;}
.pill.active{background:var(--btn-primary); border-color:var(--btn-primary); color:#fff;}

/* ============================================================
   MODALS
   ============================================================ */
.overlay{
  position:fixed; inset:0; background:rgba(0,26,51,0.45); backdrop-filter:blur(2px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:24px;
}
.overlay.active{display:flex;}
.modal{
  background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  width:100%; max-height:88vh; overflow:auto; animation:pop .16s ease;
}
@keyframes pop{from{opacity:0; transform:scale(.97);} to{opacity:1; transform:none;}}
.modal-sm{max-width:420px;}
.modal-md{max-width:640px;}
.modal-lg{max-width:920px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;}
.modal-body{padding:22px;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border); background:var(--zebra);}
.modal-close{width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:var(--text-secondary); border:none; background:transparent;}
.modal-close:hover{background:var(--zebra);}

/* Fake browser-tab window used for "PDF preview opens in new tab" */
.browser-chrome{background:#E9EBF2; border-radius:var(--radius-lg) var(--radius-lg) 0 0; padding:10px 14px;}
.browser-dots{display:flex; gap:6px; margin-bottom:8px;}
.browser-dots span{width:10px; height:10px; border-radius:50%; background:#C6CBDB;}
.browser-tabrow{display:flex; align-items:center; gap:8px;}
.browser-tab{
  background:#fff; border-radius:8px 8px 0 0; padding:7px 14px; font-size:11.5px; font-weight:600;
  display:flex; align-items:center; gap:6px; color:var(--text-primary); box-shadow:0 -1px 0 var(--border) inset;
}
.browser-tab svg{width:12px; height:12px; color:var(--st-hold-fg);}
.browser-addr{
  margin-top:8px; background:#fff; border-radius:20px; padding:6px 14px; font-size:11px; color:var(--text-secondary);
  display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono';
}
.browser-addr svg{width:12px; height:12px; color:#5C6B7A;}

/* ============================================================
   STEPPER (order wizard)
   ============================================================ */
.stepper{display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap;}
.step-chip{
  flex:1; min-width:170px; background:#fff; border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; display:flex; align-items:center; gap:11px; cursor:pointer;
}
.step-chip .n{
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; background:var(--zebra); color:var(--text-secondary); flex-shrink:0;
}
.step-chip .t{font-size:12.5px; font-weight:700;}
.step-chip .s{font-size:11px; color:var(--text-secondary);}
.step-chip.current{border-color:var(--btn-primary); background:var(--card-highlight-bg);}
.step-chip.current .n{background:var(--btn-primary); color:#fff;}
.step-chip.current .t{color:var(--btn-primary);}
.step-chip.complete .n{background:var(--st-done-fg); color:#fff;}
.step-chip.complete .s{color:var(--st-done-fg);}

/* ============================================================
   DASHBOARD — flow rail + kanban
   ============================================================ */
.flow-rail{
  display:flex; align-items:stretch; gap:0; margin-bottom:22px;
  background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm);
}
.flow-stop{
  flex:1; padding:14px 16px; position:relative; border-right:1px dashed var(--border);
  display:flex; flex-direction:column; gap:4px; min-width:118px;
}
.flow-stop:last-child{border-right:none;}
.flow-stop::after{
  content:''; position:absolute; right:-7px; top:50%; transform:translateY(-50%) rotate(45deg);
  width:9px; height:9px; border-top:1px dashed var(--border); border-right:1px dashed var(--border); z-index:2;
}
.flow-stop:last-child::after{display:none;}
.flow-stop .lbl{font-size:11px; color:var(--text-secondary); font-weight:600;}
.flow-stop .val{font-size:20px; font-weight:700; font-family:'IBM Plex Mono'; color:var(--text-primary);}
.flow-stop.hot{background:var(--card-highlight-bg);}

.kanban{display:flex; gap:14px; overflow-x:auto; padding-bottom:10px;}
.kanban-col{
  flex:0 0 250px; background:#F7F8FC; border:1px solid var(--border); border-radius:var(--radius-md);
  display:flex; flex-direction:column; max-height:640px;
}
.kanban-col-head{
  padding:12px 14px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border); font-size:12.5px; font-weight:700;
}
.kanban-col-head .count{background:#fff; border:1px solid var(--border-strong); font-size:11px; padding:1px 8px; border-radius:20px; color:var(--text-secondary); font-weight:700;}
.kanban-body{padding:10px; display:flex; flex-direction:column; gap:8px; overflow-y:auto;}
.kcard{
  background:#fff; border:1px solid var(--border); border-radius:9px; padding:10px 12px;
  box-shadow:var(--shadow-sm); cursor:pointer;
}
.kcard:hover{border-color:var(--btn-primary);}
.kcard .rf{font-size:12.5px; font-weight:700; color:var(--text-primary);}
.kcard .cust{font-size:12px; color:var(--text-secondary); margin:2px 0 6px;}
.kcard .meta{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-secondary);}
.kcard .meta .w{font-family:'IBM Plex Mono'; font-weight:600; color:var(--text-primary);}
.kanban-empty{padding:26px 10px; text-align:center; font-size:12px; color:var(--text-secondary);}

/* ============================================================
   TIMELINE (edit history)
   ============================================================ */
.timeline{position:relative; padding-left:26px;}
.timeline::before{content:''; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:var(--border);}
.tl-item{position:relative; padding-bottom:22px; cursor:pointer;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{
  position:absolute; left:-26px; top:2px; width:17px; height:17px; border-radius:50%;
  background:#fff; border:2.5px solid var(--btn-primary); z-index:1;
}
.tl-card{background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
.tl-card:hover{border-color:var(--btn-primary); background:var(--card-highlight-bg);}
.tl-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.tl-who{display:flex; align-items:center; gap:8px;}
.tl-who .name{font-size:13px; font-weight:700;}
.tl-when{font-size:11px; color:var(--text-secondary); font-family:'IBM Plex Mono'; white-space:nowrap;}
.tl-desc{font-size:12.5px; color:var(--text-secondary); margin-top:4px;}
.tl-fields{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.tl-field-chip{font-size:10.5px; background:var(--zebra); border:1px solid var(--border); padding:2px 8px; border-radius:20px; color:var(--text-secondary);}

/* diff table */
.diff-table{width:100%; border-collapse:collapse; margin-top:6px;}
.diff-table th{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-secondary); text-align:left; padding:8px 10px; border-bottom:1px solid var(--border);}
.diff-table td{padding:10px; font-size:12.5px; border-bottom:1px solid var(--border); vertical-align:top;}
.diff-old{color:var(--st-hold-fg); text-decoration:line-through; text-decoration-color:var(--st-hold-bd); font-family:'IBM Plex Mono';}
.diff-new{color:var(--st-done-fg); font-weight:600; font-family:'IBM Plex Mono';}
.diff-field{font-weight:600;}

/* ============================================================
   MISC
   ============================================================ */
.divider{height:1px; background:var(--border); margin:20px 0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--text-primary); color:#fff; padding:12px 20px; border-radius:10px; font-size:13px;
  display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none;
  transition:all .22s ease; z-index:200;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast svg{width:16px; height:16px; color:var(--st-done-bd); flex-shrink:0;}
.locked-tag{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; color:var(--text-secondary); font-weight:600;}
.locked-tag svg{width:11px; height:11px;}
.section-label{font-size:13px; font-weight:700; color:var(--text-primary); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.trash-toggle{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-secondary); cursor:pointer; user-select:none;}
.switch{width:34px; height:19px; border-radius:20px; background:var(--border-strong); position:relative; transition:.15s;}
.switch::after{content:''; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.25);}
.switch.on{background:var(--btn-primary);}
.switch.on::after{left:17px;}
.total-box{background:var(--card-highlight-bg); border:1px solid #C9DBFF; border-radius:10px; padding:14px 18px; min-width:260px;}
.total-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; color:var(--text-secondary);}
.total-row.grand{font-size:14.5px; font-weight:700; color:var(--text-primary); border-top:1px solid #C9DBFF; margin-top:6px; padding-top:8px;}
.total-row span:last-child{font-family:'IBM Plex Mono';}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============================================================
   INVOICE EDIT — FULL PAGE LAYOUT
   ============================================================ */
.inv-page{display:flex; flex-direction:column; gap:0;}
.inv-topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0 18px; gap:16px; flex-wrap:wrap;
}
.inv-topbar-left{display:flex; align-items:center; gap:14px;}
.inv-back{
  width:34px; height:34px; border-radius:9px; border:1px solid var(--border-strong);
  background:#fff; display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary); cursor:pointer; flex-shrink:0;
}
.inv-back:hover{border-color:var(--btn-primary); color:var(--btn-primary); background:var(--card-highlight-bg);}
.inv-back svg{width:16px; height:16px;}
.inv-title h1{font-size:20px; margin:0;}
.inv-title .sub{font-size:12px; color:var(--text-secondary); margin-top:2px;}
.inv-topbar-right{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

.inv-header-row{
  display:grid; grid-template-columns: 170px 160px 1fr 1fr 200px;
  gap:12px; margin-bottom:22px; align-items:start;
}
.inv-header-row .field label{font-size:11px; color:var(--text-secondary); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
.inv-header-row input{font-size:13px;}

.inv-body{display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start;}
.inv-left{display:flex; flex-direction:column; gap:16px;}
.inv-right{position:sticky; top:76px; display:flex; flex-direction:column; gap:16px;}

.panel{
  background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm); overflow:hidden;
}
.panel-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 18px; border-bottom:1px solid var(--border); background:var(--zebra);
}
.panel-head .title{display:flex; align-items:center; gap:9px; font-size:18px; font-weight:700;}
.panel-head .title svg{width:18px; height:18px; color:var(--btn-primary);}
.panel-body{padding:18px;}

/* calc table */
.calc-service-row{margin-bottom:14px;}
.calc-service-row label{font-size:11.5px; font-weight:600; color:var(--text-secondary); display:block; margin-bottom:6px;}
/* calc rows — no table headers, clean list layout */
.calc-rows{display:flex; flex-direction:column; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-top:12px;}
.calc-row{
  display:grid; grid-template-columns:1fr 180px 56px;
  align-items:center; border-bottom:1px solid var(--border);
}
.calc-row:last-child{border-bottom:none;}
.calc-row:nth-child(even){background:var(--zebra);}
.calc-row-label{
  padding:12px 16px; font-size:13.5px; color:var(--text-primary);
  display:flex; align-items:center; gap:8px;
}
.calc-row-label.active{color:var(--btn-primary); font-weight:600;}
.calc-row-input{padding:8px 10px; display:flex; justify-content:flex-end;}
.calc-row-input input{
  font-family:'IBM Plex Mono'; font-size:13.5px; text-align:right;
  border:1px solid var(--border-strong); border-radius:8px; padding:8px 12px;
  width:160px; background:#fff; color:var(--text-primary); transition:border-color .12s;
}
.calc-row-input input:focus{outline:none; border-color:var(--btn-primary); box-shadow:0 0 0 3px rgba(0,86,255,.12);}
.calc-row-input input.highlight{
  border-color:var(--btn-primary); background:var(--card-highlight-bg); font-weight:600;
}
.calc-unit{padding:12px 14px 12px 4px; font-size:12.5px; color:var(--text-secondary); white-space:nowrap;}
/* subtotal row — matches reference: light peach bg, large right-aligned number */
.calc-subtotal{
  display:flex; justify-content:space-between; align-items:center;
  background:#FEF3EB; border:1px solid #F5C9A0;
  border-radius:10px; padding:14px 20px; margin-top:14px;
}
.calc-subtotal .lbl{font-size:13px; color:#7A4010; font-weight:600;}
.calc-subtotal .val{
  font-size:22px; font-weight:700; font-family:'IBM Plex Mono';
  color:var(--text-primary); letter-spacing:-.01em;
}
.calc-subtotal .val .unit{font-size:13px; font-weight:500; color:var(--text-secondary); margin-left:5px;}
/* service label above the rows */
.calc-service-row{margin-bottom:4px;}
.calc-service-row label{font-size:11.5px; font-weight:600; color:var(--text-secondary); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
.calc-service-row input{font-size:13.5px; max-width:440px; width:100%;}

/* summary panel */
.summary-currency{font-size:11px; color:var(--text-secondary); text-align:right; margin-bottom:8px;}
.summary-row{display:flex; justify-content:space-between; padding:6px 0; font-size:13px;}
.summary-row span:last-child{font-family:'IBM Plex Mono'; font-weight:500;}
.summary-total-box{
  background:var(--card-highlight-bg); border:1.5px solid var(--btn-primary);
  border-radius:10px; padding:14px 16px; margin-top:10px;
}
.summary-total-label{font-size:11px; color:var(--btn-primary); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
.summary-grand{font-size:24px; font-weight:700; font-family:'IBM Plex Mono'; color:var(--btn-primary);}
.summary-grand-note{font-size:11px; color:var(--text-secondary); margin-top:4px;}
.note-panel textarea{
  width:100%; font-family:'Sarabun'; font-size:16px; color:var(--text-primary);
  border:1px solid var(--border-strong); border-radius:10px; padding:12px 14px;
  resize:vertical; min-height:90px;
}
.note-panel textarea:focus{outline:none; border-color:var(--btn-primary); box-shadow:0 0 0 3px rgba(0,86,255,.12);}
.inv-btn-history{
  display:inline-flex; align-items:center; gap:6px; color:var(--btn-primary);
  font-size:12.5px; font-weight:600; border:1px solid var(--btn-primary);
  background:transparent; border-radius:8px; padding:8px 13px; cursor:pointer;
}
.inv-btn-history:hover{background:var(--card-highlight-bg);}
.inv-btn-history svg{width:14px; height:14px;}
.inv-btn-draft{
  display:inline-flex; align-items:center; gap:6px; color:var(--text-primary);
  font-size:12.5px; font-weight:600; border:1px solid var(--border-strong);
  background:#fff; border-radius:8px; padding:8px 13px; cursor:pointer;
}
.inv-btn-draft:hover{border-color:var(--btn-primary); color:var(--btn-primary);}
.inv-btn-draft svg{width:14px; height:14px;}

/* ============================================================
   DASHBOARD — 3-LANE KANBAN (Flat Design)
   ============================================================ */
.dash-search{
  display:flex; align-items:center; gap:10px; margin-bottom:18px;
  background:#fff; border:1px solid var(--border); border-radius:10px;
  padding:10px 14px; box-shadow:var(--shadow-sm);
}
.dash-search svg{width:16px; height:16px; color:var(--text-secondary); flex-shrink:0;}
.dash-search input{
  flex:1; border:none; outline:none; font-family:inherit; font-size:13.5px;
  color:var(--text-primary); background:transparent;
}
.dash-search input::placeholder{color:var(--text-secondary);}
.dash-search button{
  background:var(--btn-primary); color:#fff; border:none; border-radius:7px;
  padding:7px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
}
.dash-search button:hover{background:var(--btn-primary-hover);}

.lane-wrap{display:flex; flex-direction:column; gap:24px; margin-top:4px;}
.lane{}
/* Lane label strip — thin, no card box wrapping columns */
.lane-strip{
  display:flex; align-items:center; gap:10px;
  padding:0 0 10px 0; border-bottom:2px solid transparent; margin-bottom:12px;
}
.lane-strip.lane1{border-bottom-color:#0056FF;}
.lane-strip.lane2{border-bottom-color:#F0B37E;}
.lane-strip.lane3{border-bottom-color:#8FD4A3;}
.lane-badge{
  width:26px; height:26px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; color:#fff; flex-shrink:0;
}
.lane1 .lane-badge{background:#0056FF;}
.lane2 .lane-badge{background:#C97A2A;}
.lane3 .lane-badge{background:#1E7E34;}
.lane-title{font-size:13.5px; font-weight:700; color:var(--text-primary);}
.lane-sub{font-size:11.5px; color:var(--text-secondary); margin-left:4px;}
.lane-total{
  margin-left:auto; font-size:11.5px; font-weight:700; font-family:'IBM Plex Mono';
  color:var(--text-secondary); white-space:nowrap;
}
/* columns sit directly under the strip — no wrapping card */
.lane-cols{display:flex; gap:12px; overflow-x:auto; padding-bottom:6px;}
.lane-col{
  flex:0 0 220px; background:#fff; border:1px solid var(--border);
  border-radius:var(--radius-md); display:flex; flex-direction:column;
  box-shadow:var(--shadow-sm);
}
.lane-col-head{
  padding:9px 13px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border); font-size:12px; font-weight:700;
  background:var(--zebra); border-radius:var(--radius-md) var(--radius-md) 0 0;
}
.lane-col-head .lc-count{
  font-size:10.5px; font-weight:700; font-family:'IBM Plex Mono';
  background:#fff; border:1px solid var(--border); padding:1px 7px; border-radius:20px; color:var(--text-secondary);
}
.lane-col-body{padding:8px; display:flex; flex-direction:column; gap:7px; max-height:380px; overflow-y:auto;}
.lane-empty{padding:22px 8px; text-align:center; font-size:11.5px; color:var(--text-secondary);}

</style>
</head>

<script>
/* ============================================================

   ============================================================ */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const esc = s => (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let state = {
  page:'dashboard',
  orderTab:'all',
  lotStage:'all',
  acctTab:'nonum',
  stockTab:'prep',
  custShowTrash:false,
  wizardStep:1,
  invoiceNo:null,
  invoiceMode:'new',
};

/* ---------- SIDEBAR ---------- */
function renderSidebar(){
  const groups = {};
  NAV.forEach(n=>{ (groups[n.group] = groups[n.group]||[]).push(n); });
  let html = '';
  Object.keys(groups).forEach(g=>{
    html += `<div class="sidebar-section-label">${esc(g)}</div>`;
    groups[g].forEach(n=>{
      const isActive = state.page===n.key || (state.page==='invoice-edit' && n.key==='accounting');
      html += `<div class="nav-item ${isActive?'active':''}" data-nav="${n.key}">
        ${ICONS[n.key]}<span>${esc(n.label)}</span>
        ${n.count!==undefined ? `<span class="badge-count">${n.count}</span>`:''}
      </div>`;
    });
  });
  $('#sidebarNav').innerHTML = html;
  $$('.nav-item').forEach(el=>el.addEventListener('click', ()=>{ goPage(el.dataset.nav); }));
}

function goPage(key){
  state.page = key;
  renderSidebar();
  renderBreadcrumb();
  renderPage();
  window.scrollTo({top:0,behavior:'instant'});
}

function renderBreadcrumb(){
  if(state.page==='invoice-edit'){
    const mode = state.invoiceMode==='new' ? 'สร้าง Invoice ใหม่' : `แก้ไข Invoice · ${esc(state.invoiceNo||'')}`;
    $('#breadcrumb').innerHTML = `<span>ระบบจัดการ Order ทอง</span><span>›</span><span data-go="accounting" style="cursor:pointer;">บัญชี</span><span>›</span><b>${esc(mode)}</b>`;
    return;
  }
  const n = NAV.find(x=>x.key===state.page);
  $('#breadcrumb').innerHTML = `<span>ระบบจัดการ Order ทอง</span><span>›</span><b>${esc(n?n.label:'')}</b>`;
}

/* ---------- TOAST ---------- */
function toast(msg){
  const t = $('#toast');
  t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span>${esc(msg)}</span>`;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- MODAL ---------- */
function openModal(html){
  const root = $('#overlayRoot');
  root.innerHTML = html;
  root.classList.add('active');
  root.addEventListener('click', e=>{ if(e.target===root) closeModal(); }, {once:true});
}
function closeModal(){ $('#overlayRoot').classList.remove('active'); $('#overlayRoot').innerHTML=''; }

        <p style="font-size:12.5px; color:var(--text-secondary); line-height:1.6;">ระบบใช้ Soft Delete — ข้อมูลจะไม่ถูกลบถาวร และสามารถกู้คืนได้ภายหลังจากเมนู "แสดงรายการที่ลบแล้ว"</p>
      </div>
      <div class="modal-foot" style="justify-content:center;">
        <button class="btn btn-secondary" data-close-modal>ยกเลิก</button>
        <button class="btn btn-danger-ghost" data-action="${onConfirmAction}" ${extraData}>ย้ายไปถังขยะ</button>
      </div>
    </div>`;
}

/* ============================================================
   EVENT BINDING (delegated where possible)
   ============================================================ */
function bindPageEvents(){
  // tabs
  $$('[data-tab]').forEach(el=>el.addEventListener('click', ()=>{
    const group = el.dataset.tab, key = el.dataset.key;
    if(group==='order') state.orderTab = key;
    if(group==='lot') state.lotStage = key;
    if(group==='acct') state.acctTab = key;
    renderPage();
  }));

  // nav-to-page buttons
  $$('[data-go]').forEach(el=>el.addEventListener('click', ()=>goPage(el.dataset.go)));

  // detail rows/cards
  $$('[data-detail]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    openModal(genericDetailModal(el.dataset.detail));
    bindModalEvents();
  }));

  // manual search
  $$('[data-action="manual-search"]').forEach(el=>el.addEventListener('click', ()=>toast('ค้นหาแล้ว — โหลดผลลัพธ์ล่าสุด')));

  // orders
  const newOrderBtn = $('[data-action="new-order"]');
  if(newOrderBtn) newOrderBtn.addEventListener('click', ()=>{ state.wizardStep=1; openModal(orderWizardModal()); bindModalEvents(); });
  $$('[data-action="cancel-order"]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    openModal(confirmDeleteModal(el.dataset.rf, 'confirm-cancel-order'));
    bindModalEvents();
  }));

  // lot allocate checkboxes
  const checkAll = $('#lotCheckAll');
  if(checkAll) checkAll.addEventListener('change', ()=>{
    $$('.lot-check').forEach(cb=>cb.checked = checkAll.checked);
    updateLotSelection();
  });
  $$('.lot-check').forEach(cb=>cb.addEventListener('change', updateLotSelection));
  const createLotBtn = $('#lotCreateBtn');
  if(createLotBtn) createLotBtn.addEventListener('click', ()=>{ toast('จัดกลุ่ม Lot สำเร็จ'); });

  // customers
  const addCustBtn = $('[data-action="add-customer"]');
  if(addCustBtn) addCustBtn.addEventListener('click', ()=>{ openModal(addCustomerModal()); bindModalEvents(); });
  $$('[data-action="delete-customer"]').forEach(el=>el.addEventListener('click', ()=>{
    openModal(confirmDeleteModal(CUSTOMERS[el.dataset.idx].name, 'confirm-delete-customer', `data-idx="${el.dataset.idx}"`));
    bindModalEvents();
  }));
  $$('[data-action="edit-customer"]').forEach(el=>el.addEventListener('click', ()=>{ openModal(addCustomerModal()); bindModalEvents(); }));
  const trashToggle = $('[data-action="toggle-trash"]');
  if(trashToggle) trashToggle.addEventListener('click', ()=>{ state.custShowTrash = !state.custShowTrash; renderPage(); });
  $$('[data-action="restore-customer"]').forEach(el=>el.addEventListener('click', ()=>{ toast('กู้คืนข้อมูลลูกค้าเรียบร้อย'); state.custShowTrash=false; renderPage(); }));

  // users
  const addUserBtn = $('[data-action="add-user"]');
  if(addUserBtn) addUserBtn.addEventListener('click', ()=>{ openModal(addUserModal()); bindModalEvents(); });
  $$('[data-action="delete-user"]').forEach(el=>el.addEventListener('click', ()=>{
    openModal(confirmDeleteModal(USERS[el.dataset.idx].name, 'confirm-delete-user'));
    bindModalEvents();
  }));
  $$('[data-action="edit-user"], [data-action="view-user"]').forEach(el=>el.addEventListener('click', ()=>{ openModal(addUserModal()); bindModalEvents(); }));
  const userTrashToggle = $('[data-action="toggle-user-trash"]');
  if(userTrashToggle) userTrashToggle.addEventListener('click', (e)=>{
    e.currentTarget.querySelector('.switch').classList.toggle('on');
    toast('ยังไม่มีผู้ใช้งานที่ถูกลบในช่วงนี้');
  });

  // accounting — invoice goes to full page
  $$('[data-action="create-invoice"]').forEach(el=>el.addEventListener('click', ()=>{
    state.invoiceNo = el.dataset.rf||null; state.invoiceMode='new'; goPage('invoice-edit');
  }));
  $$('[data-action="edit-invoice"]').forEach(el=>el.addEventListener('click', ()=>{
    state.invoiceNo = el.dataset.no||null; state.invoiceMode='edit'; goPage('invoice-edit');
  }));
  $$('[data-action="preview-invoice"]').forEach(el=>el.addEventListener('click', ()=>{ openModal(pdfPreviewModal(el.dataset.no)); bindModalEvents(); }));
  const genInv = $('[data-action="create-general-invoice"]');
  if(genInv) genInv.addEventListener('click', ()=>{ state.invoiceNo=null; state.invoiceMode='new'; goPage('invoice-edit'); });

  // invoice full-page actions
  const draftBtn = $('[data-action="draft-invoice"]');
  if(draftBtn) draftBtn.addEventListener('click', ()=>toast('บันทึกร่างแล้ว'));
  const savePreviewBtn = $('[data-action="save-and-preview-invoice"]');
  if(savePreviewBtn) savePreviewBtn.addEventListener('click', ()=>{ openModal(pdfPreviewModal(state.invoiceNo||'ใหม่')); bindModalEvents(); });
  const autoFormula = $('[data-action="auto-formula"]');
  if(autoFormula) autoFormula.addEventListener('click', ()=>toast('คำนวณอัตโนมัติจากสูตร — อัปเดตยอดแล้ว'));
  const showHistInv = $('[data-action="show-history-inv"]');
  if(showHistInv) showHistInv.addEventListener('click', ()=>{ goPage('history'); });

  // history
  $$('[data-history]').forEach(el=>el.addEventListener('click', ()=>{ openModal(historyDiffModal(el.dataset.history)); bindModalEvents(); }));

  bindModalEvents();
}

function updateLotSelection(){
  const n = $$('.lot-check:checked').length;
  const label = $('#lotSelectedCount');
  if(label) label.textContent = `เลือกแล้ว ${n} รายการ`;
  const btn = $('#lotCreateBtn');
  if(btn) btn.disabled = n===0;
}

function bindModalEvents(){
  $$('[data-close-modal]').forEach(el=>el.addEventListener('click', closeModal));
  $$('[data-wizard-step]').forEach(el=>el.addEventListener('click', ()=>{
    state.wizardStep = parseInt(el.dataset.wizardStep);
    closeModal(); openModal(orderWizardModal()); bindModalEvents();
  }));
  const wizSave = $('[data-action="wizard-save"]');
  if(wizSave) wizSave.addEventListener('click', ()=>{ toast('บันทึกร่างเรียบร้อย'); closeModal(); });
  const wizSend = $('[data-action="wizard-send"]');
  if(wizSend) wizSend.addEventListener('click', ()=>{ toast('ส่งหลอมเรียบร้อย — ย้ายไปขั้นตอนถัดไป'); closeModal(); renderSidebar(); });

  const confirmCancelOrder = $('[data-action="confirm-cancel-order"]');
  if(confirmCancelOrder) confirmCancelOrder.addEventListener('click', ()=>{ toast('ย้าย Order ไปถังขยะแล้ว (กู้คืนได้)'); closeModal(); });
  const confirmDelCust = $('[data-action="confirm-delete-customer"]');
  if(confirmDelCust) confirmDelCust.addEventListener('click', (e)=>{
    const idx = e.currentTarget.dataset.idx;
    const removed = CUSTOMERS.splice(idx,1)[0];
    if(removed){ removed.deletedBy='office@kgr.local'; removed.deletedAt='18/08/2569 · เมื่อสักครู่'; CUSTOMERS_TRASH.unshift(removed); }
    toast('ย้ายลูกค้าไปถังขยะแล้ว');
    closeModal(); renderPage();
  });
  const confirmDelUser = $('[data-action="confirm-delete-user"]');
  if(confirmDelUser) confirmDelUser.addEventListener('click', ()=>{ toast('ย้ายผู้ใช้งานไปถังขยะแล้ว'); closeModal(); renderPage(); });

  const saveCust = $('[data-action="save-customer"]');
  if(saveCust) saveCust.addEventListener('click', ()=>{ toast('บันทึกข้อมูลลูกค้าเรียบร้อย'); closeModal(); renderPage(); });
  const saveUser = $('[data-action="save-user"]');
  if(saveUser) saveUser.addEventListener('click', ()=>{ toast('บันทึกข้อมูลผู้ใช้งานเรียบร้อย'); closeModal(); renderPage(); });

  const saveInv = $('[data-action="save-invoice"]');
  if(saveInv) saveInv.addEventListener('click', ()=>{ toast('บันทึก invoice แล้ว — ปุ่ม "แก้ไข" และ "Preview" ใช้งานได้ตลอด'); closeModal(); renderPage(); });
  const doPreview = $('[data-action="do-preview"]');
  if(doPreview) doPreview.addEventListener('click', (e)=>{ closeModal(); openModal(pdfPreviewModal(e.currentTarget.dataset.no)); bindModalEvents(); });
  const dlPdf = $('[data-action="download-pdf"]');
  if(dlPdf) dlPdf.addEventListener('click', ()=>toast('ดาวน์โหลด PDF สำเร็จ'));

  const gotoHistory = $('[data-action="goto-history"]');
  if(gotoHistory) gotoHistory.addEventListener('click', ()=>{ closeModal(); goPage('history'); });
}

/* ============================================================
   INIT
   ============================================================ */
renderSidebar();
renderBreadcrumb();
renderPage();

</script>
</body>
</html>
