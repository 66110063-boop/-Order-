<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KGR Group — ระบบจัดการ Order ทอง (Prototype v2)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-logo">
        <img src="PNG KGR.png" alt="KGR Logo">
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <!-- Dynamic sidebar content rendered by JS -->
      </nav>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <!-- MAIN CONTENT -->
    <main class="main">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="menu-toggle" id="menuToggle" aria-label="เปิดเมนู" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="breadcrumb" id="breadcrumb">
            <!-- Dynamic breadcrumb rendered by JS -->
          </div>
        </div>
        <div class="topbar-right">
          <div class="era-toggle">ปี พ.ศ. <b>2569</b></div>
          <div class="topbar-user">
            <div class="avatar-chip">A</div>
            <span>Admin</span>
          </div>
        </div>
      </header>

      <div class="content" id="content">
        <!-- Dynamic page content rendered by JS -->
      </div>
    </main>
  </div>

  <!-- Global Modal Container -->
  <div class="overlay" id="overlayRoot"></div>

  <!-- Toast Container -->
  <div class="toast" id="toast"></div>

  <!-- Modular JavaScript Scripts -->
  <script src="js/config/data.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/workflow/stations.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/orders.js"></script>
  <script src="js/views/lots.js"></script>
  <script src="js/views/customers.js"></script>
  <script src="js/views/invoices.js"></script>
  <script src="js/views/history.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
