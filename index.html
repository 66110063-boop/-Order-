<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KGR Group — ระบบจัดการ Order ทอง (Updated v2.1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --header-bg:oklch(27.2% 0.120 261.3);
  --header-fg:oklch(100% 0 0);
  --btn-primary:oklch(53.5% 0.259 262.6);
  --btn-primary-fg:oklch(100% 0 0);
  --btn-primary-hover:oklch(45.4% 0.217 262.4);
  --table-head-bg:oklch(37.1% 0.173 262.1);
  --table-head-fg:oklch(100% 0 0);
  --text-primary:oklch(27.9% 0.037 260.0);
  --card-highlight-bg:oklch(95.2% 0.023 258.4);
  --page-bg:oklch(98.4% 0.003 247.9);
  --surface:oklch(100% 0 0);
  --text-secondary:oklch(44.6% 0.026 256.8);
  --border:oklch(92.9% 0.013 255.5);
  --border-strong:oklch(80.7% 0.039 272.4);
  --zebra:oklch(97.5% 0.005 258.3);
  --sidebar-bg:oklch(100% 0 0);
  --sidebar-active:oklch(27.2% 0.120 261.3);
  --sidebar-fg:oklch(37.2% 0.039 257.3);
  --sidebar-active-pill-bg:oklch(95.2% 0.023 258.4);
  --fg-on-dark:oklch(100% 0 0);
  --nav-hover-bg:oklch(97.5% 0.010 258.4);
  --nav-hover-fg:oklch(27.2% 0.120 261.3);

  --st-progress-bg:oklch(94.4% 0.031 59.7); --st-progress-fg:oklch(45.7% 0.121 50.0); --st-progress-bd:oklch(81.2% 0.099 61.7);
  --st-done-bg:oklch(94.3% 0.032 155.4);     --st-done-fg:oklch(52.2% 0.140 146.9);    --st-done-bd:oklch(81.1% 0.098 152.9);
  --st-hold-bg:oklch(92.8% 0.030 20.3);      --st-hold-fg:oklch(46.5% 0.169 27.7);     --st-hold-bd:oklch(78.9% 0.091 21.8);
  --st-info-bg:oklch(95.7% 0.007 260.7);     --st-info-fg:oklch(39.4% 0.033 257.1);    --st-info-bd:oklch(88.5% 0.019 266.0);
  --st-sched-bg:oklch(93.9% 0.027 299.5);    --st-sched-fg:oklch(43.2% 0.211 292.8);   --st-sched-bd:oklch(81.6% 0.080 298.5);

  /* Document-type badges — ต้นฉบับ/สำเนา */
  --doc-original-bg:oklch(97.3% 0.069 103.2); --doc-original-fg:oklch(47.6% 0.103 61.9); --doc-original-bd:oklch(92.4% 0.115 95.7);
  --doc-copy1-bg:oklch(96.2% 0.043 156.7);    --doc-copy1-fg:oklch(44.8% 0.108 151.3);   --doc-copy1-bd:oklch(87.1% 0.136 154.4);
  --doc-copy2-bg:oklch(93.2% 0.032 255.6);    --doc-copy2-fg:oklch(42.4% 0.181 265.6);   --doc-copy2-bd:oklch(80.9% 0.096 251.8);

  --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
  --space-2xs:8px; --space-xs:12px; --space-sm:16px; --space-md:20px; --space-lg:24px; --space-xl:32px;
  --ease-out:cubic-bezier(0.16, 1, 0.3, 1);
  --shadow-sm:0 1px 2px rgba(0,26,51,0.06); --shadow-md:0 4px 16px rgba(0,32,96,0.10); --shadow-lg:0 12px 40px rgba(0,32,96,0.18);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Sarabun', sans-serif;
  background:var(--page-bg);
  color:var(--text-primary);
  font-size:18px; /* ปรับขนาดฟอนต์ให้ใหญ่ขึ้นตามข้อ 34 */
  line-height:1.5;
}
.num, .mono{
  font-family:'IBM Plex Mono', monospace;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0; font-weight:700;}
button{font-family:inherit; cursor:pointer;}

.app{display:flex; min-height:100vh;}
.sidebar{
  width:250px; flex-shrink:0; background:var(--sidebar-bg);
  color:var(--sidebar-fg); display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; border-right:1px solid var(--border);
}
.sidebar-logo{
  height:60px; display:flex; align-items:center; justify-content:center;
  padding:0 20px; border-bottom:1px solid var(--border); font-weight:700; color:var(--header-bg);
}
.sidebar-nav{flex:1; padding:18px 14px; overflow-y:auto;}
.sidebar-section-label{
  font-size:14px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-secondary); padding:16px 12px 8px; font-weight:600;
}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:11px 14px;
  border-radius:12px; margin-bottom:5px; font-size:16px; font-weight:500;
  color:var(--sidebar-fg); cursor:pointer; position:relative;
}
.nav-item.active{
  background:var(--sidebar-active-pill-bg); color:var(--sidebar-active); font-weight:700;
}
.nav-item.active::before{
  content:''; position:absolute; left:-2px; top:50%; transform:translateY(-50%);
  width:4px; height:20px; border-radius:4px; background:var(--sidebar-active);
}

.main{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--page-bg);}
.topbar{
  height:60px; background:var(--header-bg); color:var(--header-fg);
  display:flex; align-items:center; justify-content:space-between; padding:0 22px;
  position:sticky; top:0; z-index:30; box-shadow:var(--shadow-sm);
}
.breadcrumb{font-size:16px; color:rgba(255,255,255,0.8); display:flex; align-items:center; gap:6px;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.era-toggle{font-size:15px; background:rgba(255,255,255,0.15); padding:4px 12px; border-radius:20px;}

.content{padding:var(--space-xl); flex:1;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:var(--space-lg); gap:var(--space-sm);}
.page-head h1{font-size:26px;}

.btn{
  display:inline-flex; align-items:center; gap:8px; border-radius:10px;
  padding:10px 18px; font-size:16px; font-weight:600; border:1px solid transparent; transition:0.12s;
}
.btn-primary{background:var(--header-bg); color:var(--fg-on-dark);}
.btn-primary:hover{background:var(--btn-primary);}
.btn-secondary{background:var(--surface); color:var(--text-primary); border-color:var(--border-strong);}
.btn-sm{padding:6px 12px; font-size:15px; border-radius:8px;}

.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:15px; font-weight:600;}
input[type=text], select, textarea{
  font-family:inherit; font-size:16px; color:var(--text-primary);
  border:1px solid var(--border-strong); border-radius:8px; padding:10px 12px;
  background:var(--surface); width:100%;
}
input.num-input{font-family:'IBM Plex Mono'; text-align:right;}

.table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden;}
table{width:100%; border-collapse:collapse;}
thead th{
  background:var(--table-head-bg); color:var(--table-head-fg);
  font-size:15px; font-weight:700; text-align:left; padding:12px 16px;
}
tbody td{padding:14px 16px; font-size:16px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:nth-child(even){background:var(--zebra);}
td.num, th.num{font-family:'IBM Plex Mono'; text-align:right; font-weight:700;}
td.right, th.right{text-align:right;}

.doc-badge{
  display:inline-flex; align-items:center; font-size:13px; font-weight:700;
  padding:2px 8px; border-radius:999px; border:1px solid transparent; margin-left:8px;
}
.doc-original{background:var(--doc-original-bg); color:var(--doc-original-fg); border-color:var(--doc-original-bd);}
.doc-copy1{background:var(--doc-copy1-bg); color:var(--doc-copy1-fg); border-color:var(--doc-copy1-bd);}
.doc-copy2{background:var(--doc-copy2-bg); color:var(--doc-copy2-fg); border-color:var(--doc-copy2-bd);}

.tabs{display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:18px;}
.tab{
  padding:10px 16px; font-size:16px; font-weight:600; color:var(--text-secondary);
  border-bottom:3px solid transparent; cursor:pointer; margin-bottom:-1px;
}
.tab.active{color:var(--btn-primary); border-bottom-color:var(--btn-primary); background:var(--card-highlight-bg);}

.overlay{
  position:fixed; inset:0; background:rgba(0,26,51,0.45);
  display:none; align-items:center; justify-content:center; z-index:100; padding:24px;
}
.overlay.active{display:flex;}
.modal{
  background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  width:100%; max-width:680px; max-height:90vh; overflow:auto;
}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
.modal-body{padding:20px;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:14px 20px; border-top:1px solid var(--border); background:var(--zebra);}

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--text-primary); color:var(--fg-on-dark); padding:12px 20px; border-radius:8px; font-size:15px;
  display:none; z-index:200; box-shadow:var(--shadow-lg);
}
.toast.show{display:block;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">K.G.R. GROUP</div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb">ระบบจัดการ Order ทอง</div>
      <div class="topbar-right">
        <div class="era-toggle"><b>พ.ศ. 2569</b></div>
        <div>office@kgr.local</div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlayRoot"></div>
<div class="toast" id="toast"></div>

<script>
// NAV อัปเดตชื่อภาษาไทยตามข้อ 27
const NAV = [
  {key:'orders', label:'บิลรับงาน', group:'หลัก'},
  {key:'lot-allocate', label:'การจัดล็อต', group:'หลัก'},
  {key:'lot-manage', label:'รีด/สกัด/หลอม99', group:'หลัก'},
  {key:'customers', label:'ข้อมูลลูกค้า', group:'ข้อมูลหลัก'},
  {key:'stock', label:'ข้อมูลสต็อก', group:'ข้อมูลหลัก'},
  {key:'accounting', label:'ข้อมูลบัญชี', group:'ข้อมูลหลัก'},
  {key:'history', label:'ประวัติการใช้งานการแก้ไข', group:'ระบบ'},
];

// ข้อมูลลูกค้า อัปเดตคอลัมน์ "วันที่สร้างลูกค้า" ตามข้อ 5
const CUSTOMERS = [
  {name:'นายศุภพัฒน์ ตริเทพาสัมพัทธ์', phone:'0904183535', orders:2, createdAt:'10/01/2569'},
  {name:'โรงงานทองไทยเจริญ', phone:'038601234', orders:5, createdAt:'15/02/2569'},
  {name:'ห้างทองชั่วเช่งเฮง', phone:'0812345674', orders:3, createdAt:'20/03/2569'},
];

// ข้อมูลสถานที่สำหรับ Cascading Dropdown ตามข้อ 38
const TH_LOCATIONS = {
  'กรุงเทพมหานคร': {
    'เขตจตุจักร': ['จตุจักร', 'ลาดยาว', 'เสนานิคม', 'จันทรเกษม'],
    'เขตบางรัก': ['บางรัก', 'สีลม', 'สุริยวงศ์']
  },
  'สมุทรปราการ': {
    'เมืองสมุทรปราการ': ['ปากน้ำ', 'สำโรงเหนือ', 'บางเมือง']
  }
};

let state = {
  page: 'customers',
  acctTab: 'withnum',
  showTrash: false
};

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function renderSidebar(){
  let html = '';
  NAV.forEach(n => {
    const active = state.page === n.key ? 'active' : '';
    html += `<div class="nav-item ${active}" onclick="goPage('${n.key}')">${n.label}</div>`;
  });
  $('#sidebarNav').innerHTML = html;
}

function goPage(key){
  state.page = key;
  renderSidebar();
  renderPage();
}

function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function openModal(html){
  const root = $('#overlayRoot');
  root.innerHTML = html;
  root.classList.add('active');
}

function closeModal(){
  $('#overlayRoot').classList.remove('active');
  $('#overlayRoot').innerHTML = '';
}

function renderPage(){
  const c = $('#content');
  if(state.page === 'customers') {
    c.innerHTML = renderCustomersPage();
  } else if(state.page === 'accounting') {
    c.innerHTML = renderAccountingPage();
  } else if(state.page === 'lot-manage') {
    c.innerHTML = renderLotManagePage();
  } else {
    c.innerHTML = `<div class="page-head"><h1>${NAV.find(n=>n.key===state.page).label}</h1></div><div class="table-wrap" style="padding:40px; text-align:center;">กำลังปรับปรุงหน้าจอตามข้อกำหนด</div>`;
  }
}

// หน้าข้อมูลลูกค้า (ข้อ 5, 38)
function renderCustomersPage(){
  const rows = CUSTOMERS.map((item, idx) => `
    <tr>
      <td><b>${item.name}</b></td>
      <td class="num" style="text-align:left;">${item.phone}</td>
      <td class="num">${item.orders}</td>
      <td>${item.createdAt}</td>
      <td class="right">
        <button class="btn btn-secondary btn-sm" onclick="showToast('แก้ไขข้อมูลลูกค้าแล้ว')">แก้ไข</button>
        <button class="btn btn-secondary btn-sm" onclick="showToast('ย้ายลงถังขยะ (Soft Delete) แล้ว')">ลบ</button>
      </td>
    </tr>
  `).join('');

  return `
    <div class="page-head">
      <div>
        <h1>ข้อมูลลูกค้า</h1>
        <div style="font-size:15px; color:var(--text-secondary);">จัดการข้อมูลลูกค้า เพิ่ม วันที่สร้าง และระบบค้นหา</div>
      </div>
      <button class="btn btn-primary" onclick="openAddCustomerModal()">+ เพิ่มข้อมูลลูกค้า</button>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <div style="display:flex; gap:10px;">
        <input type="text" placeholder="ค้นหาชื่อ หรือ เบอร์โทร" style="width:240px;">
        <button class="btn btn-secondary" onclick="showToast('ค้นหาข้อมูลเรียบร้อย')">ค้นหา (กดเอง)</button>
      </div>
      <label style="font-size:15px; cursor:pointer;">
        <input type="checkbox" onchange="state.showTrash=this.checked; renderPage();"> แสดงรายการที่ลบ (Soft Delete)
      </label>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ชื่อลูกค้า</th>
            <th>เบอร์โทร</th>
            <th class="num">จำนวน Order</th>
            <th>วันที่สร้างลูกค้า</th>
            <th class="right">จัดการ</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

// Modal เพิ่มลูกค้าพร้อม Fix Bug Cascading Dropdown (ข้อ 38)
function openAddCustomerModal(){
  const provOptions = Object.keys(TH_LOCATIONS).map(p => `<option value="${p}">${p}</option>`).join('');
  
  const html = `
    <div class="modal">
      <div class="modal-head">
        <h3>เพิ่มข้อมูลลูกค้าใหม่</h3>
        <button onclick="closeModal()" style="border:none; background:transparent; font-size:18px;">✕</button>
      </div>
      <div class="modal-body" style="display:flex; flex-direction:column; gap:12px;">
        <div class="field"><label>ชื่อ-นามสกุล/ชื่อบริษัท</label><input type="text" placeholder="ระบุชื่อลูกค้า"></div>
        <div class="field"><label>เบอร์โทรศัพท์</label><input type="text" placeholder="08XXXXXXXX"></div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="field">
            <label>จังหวัด</label>
            <select id="selProv" onchange="onProvChange(this.value)">
              <option value="">-- เลือกจังหวัด --</option>
              ${provOptions}
            </select>
          </div>
          <div class="field">
            <label>อำเภอ / เขต</label>
            <select id="selDist" disabled onchange="onDistChange(this.value)">
              <option value="">-- เลือกอำเภอ/เขต --</option>
            </select>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="field">
            <label>ตำบล / แขวง</label>
            <select id="selSubDist" disabled>
              <option value="">-- เลือกตำบล/แขวง --</option>
            </select>
          </div>
          <div class="field"><label>รหัสไปรษณีย์</label><input type="text" placeholder="10400"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-primary" onclick="showToast('บันทึกข้อมูลลูกค้าสำเร็จ'); closeModal();">บันทึก</button>
      </div>
    </div>
  `;
  openModal(html);
}

function onProvChange(prov){
  const distSel = $('#selDist');
  const subSel = $('#selSubDist');
  if(!prov || !TH_LOCATIONS[prov]){
    distSel.disabled = true; distSel.innerHTML = '<option value="">-- เลือกอำเภอ/เขต --</option>';
    subSel.disabled = true; subSel.innerHTML = '<option value="">-- เลือกตำบล/แขวง --</option>';
    return;
  }
  const dists = Object.keys(TH_LOCATIONS[prov]);
  distSel.innerHTML = '<option value="">-- เลือกอำเภอ/เขต --</option>' + dists.map(d => `<option value="${d}">${d}</option>`).join('');
  distSel.disabled = false;
  subSel.disabled = true; subSel.innerHTML = '<option value="">-- เลือกตำบล/แขวง --</option>';
}

function onDistChange(dist){
  const prov = $('#selProv').value;
  const subSel = $('#selSubDist');
  if(!dist || !TH_LOCATIONS[prov] || !TH_LOCATIONS[prov][dist]){
    subSel.disabled = true; subSel.innerHTML = '<option value="">-- เลือกตำบล/แขวง --</option>';
    return;
  }
  const subs = TH_LOCATIONS[prov][dist];
  subSel.innerHTML = '<option value="">-- เลือกตำบล/แขวง --</option>' + subs.map(s => `<option value="${s}">${s}</option>`).join('');
  subSel.disabled = false;
}

// หน้าข้อมูลบัญชี (ข้อ 10, 11, 28)
function renderAccountingPage(){
  return `
    <div class="page-head">
      <div>
        <h1>ข้อมูลบัญชี</h1>
        <div style="font-size:15px; color:var(--text-secondary);">จัดการรายการ Invoice แบ่งตามประเภทการสร้าง</div>
      </div>
      <button class="btn btn-primary" onclick="showToast('เปิดสร้าง Invoice ทั่วไป')">+ สร้าง Invoice ทั่วไป</button>
    </div>

    <!-- 3 Tabs ตามข้อ 11 -->
    <div class="tabs">
      <div class="tab ${state.acctTab==='withnum'?'active':''}" onclick="state.acctTab='withnum'; renderPage();">1). RF No ที่มีเลขที่ Invoice</div>
      <div class="tab ${state.acctTab==='nonum'?'active':''}" onclick="state.acctTab='nonum'; renderPage();">2). RF No ที่ไม่มีเลขที่ Invoice</div>
      <div class="tab ${state.acctTab==='general'?'active':''}" onclick="state.acctTab='general'; renderPage();">3). Invoice ทั่วไป</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>เลขที่ Invoice</th>
            <th>RF No</th>
            <th>วันที่ออกเอกสาร</th>
            <th>ชื่อลูกค้า</th>
            ${state.acctTab !== 'general' ? '<th class="num">ยอดรวม (บาท)</th>' : ''} <!-- ข้อ 28 เอาคอลัมน์ยอดรวมออกใน Invoice ทั่วไป -->
            <th class="right">จัดการ</th>
          </tr>
        </thead>
        <tbody>
          <tr>
