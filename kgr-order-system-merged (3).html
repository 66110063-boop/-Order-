<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KGR Group — ระบบจัดการ Order ทอง (Prototype v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Hallmark · redesign pass 3 · preserved: all copy/IA/routes, Sarabun+IBM Plex Mono
 * pass 1 fixed: re-drawn browser chrome, missing :focus-visible/reduced-motion, zero mobile breakpoints
 * pass 2 fixed: hex→OKLCH token conversion, zero mid-render hex, outline-based focus rings,
 * emoji→SVG icon, transition:all→explicit properties + named easings
 * pass 3 — enterprise B2B SaaS brand enforcement:
 *  · Primary #002060 (navy) → Topbar, primary CTA button, active-nav state
 *  · Accent  #0056FF (bright blue) → badges, focus rings, hover states, highlights
 *  · Canvas  #F8FAFC (page-bg/main-bg) vs Surface #FFFFFF (sidebar/cards/inputs) — two-tone depth
 *  · Border  #E2E8F0 on every card/table hairline
 *  · new --surface token split out of the old --page-bg (was conflating "white card" with
 *    "page canvas" — now distinct, so cards stay white even though the canvas is grey)
 *  · sidebar active state redesigned as soft blue-tint pill (sidebar is white now, needs
 *    contrast) with navy text/icon + rounded left indicator bar
 * pass 4 — Hallmark layout/structure/spacing discipline only (NOT colors/fonts —
 * those stay 100% KGR brand: #002060 / #0056FF / #F8FAFC / Sarabun + IBM Plex Mono):
 *  · added --space-3xs…--space-3xl 4pt spacing scale tokens
 *  · applied scale to macro layout rhythm: .content, .page-head, .card-pad, .lane-wrap,
 *    .search-row, .section-label, .grid-2/3/4 gaps, .modal-body, .panel-body
 *  · functional reqs already in place from prior passes: ยอดรวม column removed from
 *    Invoice ทั่วไป, editable เลขที่ Invoice + วันที่, blank + silver-extraction
 *    templates, 5-step flow (รับงาน→ส่งหลอม→ทดสอบ%→คิดค่าใช้จ่าย→ส่งให้TDC),
 *    document-type badges (ต้นฉบับ=เหลือง/สำเนา1=เขียว/สำเนา2=ฟ้า)
 */
/* ============================================================
   KGR GROUP — DESIGN TOKENS
   ============================================================ */
:root{
  /* Brand — from logo (converted to OKLCH, same appearance, per Hallmark color.md) */
  --header-bg:oklch(27.2% 0.120 261.3); /* #002060 KGR navy — Topbar, primary actions, active nav */
  --header-fg:oklch(100% 0 0);
  --btn-primary:oklch(53.5% 0.259 262.6); /* #0056FF KGR bright blue — accent, badges, hover, focus */
  --btn-primary-fg:oklch(100% 0 0);
  --btn-primary-hover:oklch(45.4% 0.217 262.4);
  --table-head-bg:oklch(37.1% 0.173 262.1);
  --table-head-fg:oklch(100% 0 0);
  --text-primary:oklch(27.9% 0.037 260.0); /* #1E293B — high-contrast readable text on light bg */
  --card-highlight-bg:oklch(95.2% 0.023 258.4);
  --soft-blue:oklch(97.0% 0.014 254.6); /* #EFF6FF — general status highlight, clean & professional */
  --page-bg:oklch(98.4% 0.003 247.9); /* #F8FAFC — clean light-grey canvas */
  --surface:oklch(100% 0 0); /* #FFFFFF — cards, sidebar, inputs, table surface */

  /* Extension neutrals (added for consistency, not from logo) — all tinted toward the brand hue */
  --text-secondary:oklch(44.6% 0.026 256.8); /* #4B5563 — darker for elderly-friendly contrast */
  --border:oklch(92.9% 0.013 255.5); /* #E2E8F0 — thin card/table hairlines */
  --border-strong:oklch(80.7% 0.039 272.4);
  --zebra:oklch(97.5% 0.005 258.3);
  --sidebar-bg:oklch(100% 0 0); /* #FFFFFF — matches surface, enterprise SaaS convention */
  --sidebar-active:oklch(27.2% 0.120 261.3); /* #002060 KGR navy — selected menu state per brand spec */
  --sidebar-fg:oklch(37.2% 0.039 257.3); /* dark slate #334155 — inactive nav text/icon */
  --sidebar-fg-active:oklch(100% 0 0);
  --sidebar-active-pill-bg:oklch(95.2% 0.023 258.4); /* soft blue-tint highlight (sidebar is white now, needs contrast) */
  --fg-on-dark:oklch(100% 0 0); /* white text on any colored/dark fill */
  --nav-hover-bg:oklch(97.5% 0.010 258.4);
  --nav-hover-fg:oklch(27.2% 0.120 261.3);

  /* Status — fixed triads, never mixed */
  --st-progress-bg:oklch(94.4% 0.031 59.7); --st-progress-fg:oklch(45.7% 0.121 50.0); --st-progress-bd:oklch(81.2% 0.099 61.7);
  --st-done-bg:oklch(94.3% 0.032 155.4);    --st-done-fg:oklch(52.2% 0.140 146.9);    --st-done-bd:oklch(81.1% 0.098 152.9);
  --st-hold-bg:oklch(92.8% 0.030 20.3);     --st-hold-fg:oklch(46.5% 0.169 27.7);     --st-hold-bd:oklch(78.9% 0.091 21.8);
  /* Status — extensions (documented separately in spec) */
  --st-info-bg:oklch(95.7% 0.007 260.7);    --st-info-fg:oklch(39.4% 0.033 257.1);    --st-info-bd:oklch(88.5% 0.019 266.0);
  --st-sched-bg:oklch(93.9% 0.027 299.5);   --st-sched-fg:oklch(43.2% 0.211 292.8);   --st-sched-bd:oklch(81.6% 0.080 298.5);
  /* Document-type badges — ต้นฉบับ/สำเนา */
  --doc-original-bg:oklch(97.3% 0.069 103.2); --doc-original-fg:oklch(47.6% 0.103 61.9); --doc-original-bd:oklch(92.4% 0.115 95.7);
  --doc-copy1-bg:oklch(96.2% 0.043 156.7);    --doc-copy1-fg:oklch(44.8% 0.108 151.3);   --doc-copy1-bd:oklch(87.1% 0.136 154.4);
  --doc-copy2-bg:oklch(93.2% 0.032 255.6);    --doc-copy2-fg:oklch(42.4% 0.181 265.6);   --doc-copy2-bd:oklch(80.9% 0.096 251.8);

  /* Component-specific tokens (lifted out of inline hex per Hallmark token discipline) */
  --sidebar-label:oklch(74.6% 0.042 258.8);
  --main-bg:oklch(98.4% 0.003 247.9); /* #F8FAFC — same clean grey canvas as page-bg */
  --card-highlight-border:oklch(89.0% 0.053 264.3);
  --stat-label:oklch(39.3% 0.150 260.4);
  --kanban-col-bg:oklch(98.0% 0.005 275.0);
  --calc-subtotal-bg:oklch(97.1% 0.016 58.6);
  --calc-subtotal-border:oklch(86.4% 0.074 64.6);
  --calc-subtotal-fg:oklch(43.6% 0.099 54.6);
  --lane2-badge:oklch(65.1% 0.134 61.2);
  --preview-body-bg:oklch(95.2% 0.008 271.3);

  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  /* Spacing scale — 4pt grid, for macro layout rhythm (page padding, section gaps) */
  --space-3xs:4px;
  --space-2xs:8px;
  --space-xs:12px;
  --space-sm:16px;
  --space-md:20px;
  --space-lg:24px;
  --space-xl:32px;
  --space-2xl:40px;
  --space-3xl:56px;

  --ease-out:cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in:cubic-bezier(0.7, 0, 0.84, 0);
  --ease-in-out:cubic-bezier(0.65, 0, 0.35, 1);
  --shadow-sm:0 1px 2px rgba(0,26,51,0.06);
  --shadow-md:0 4px 16px rgba(0,32,96,0.10);
  --shadow-lg:0 12px 40px rgba(0,32,96,0.18);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Sarabun', sans-serif;
  background:var(--page-bg);
  color:var(--text-primary);
  font-size:18px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num, .mono{
  font-family:'IBM Plex Mono','IBM Plex Sans Thai',monospace;
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.01em;
}
h1,h2,h3,h4{margin:0; font-weight:700;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}

/* ============================================================
   LAYOUT
   ============================================================ */
.app{display:flex; min-height:100vh;}

.sidebar{
  width:236px; flex-shrink:0;
  background:var(--sidebar-bg);
  color:var(--sidebar-fg);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  border-right:1px solid var(--border);
}
.sidebar-logo{
  height:56px; flex-shrink:0; box-sizing:border-box;
  display:flex; align-items:center; justify-content:center;
  padding:0 20px;
  background:var(--sidebar-bg);
  border-bottom:1px solid var(--border);
}
.sidebar-logo img{
  height:32px; width:auto; display:block;
}

.sidebar-nav{flex:1; padding:18px 14px; overflow-y:auto;}
.sidebar-section-label{
  font-size:16px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--sidebar-label); padding:16px 12px 8px;
}
.sidebar-section-label:first-child{padding-top:2px;}
.nav-item{
  display:flex; align-items:flex-start; gap:11px;
  padding:11px 14px; border-radius:12px; margin-bottom:5px;
  font-size:16px; font-weight:500; color:var(--sidebar-fg); line-height:1.35;
  cursor:pointer; user-select:none;
  transition:background .12s var(--ease-out), color .12s var(--ease-out), box-shadow .12s var(--ease-out);
  position:relative;
}
.nav-item svg{width:18px; height:18px; flex-shrink:0; opacity:.75; margin-top:1px; transition:opacity .12s var(--ease-out);}
.nav-item:hover{background:var(--nav-hover-bg); color:var(--nav-hover-fg);}
.nav-item:hover svg{opacity:1;}
.nav-item.active{
  background:var(--sidebar-active-pill-bg); color:var(--sidebar-active);
  box-shadow:0 1px 3px rgba(0,32,96,0.10), 0 1px 2px rgba(0,32,96,0.06);
}
.nav-item.active::before{
  content:''; position:absolute; left:-2px; top:50%; transform:translateY(-50%);
  width:4px; height:20px; border-radius:4px; background:var(--sidebar-active);
}
.nav-item.active svg{opacity:1; color:var(--sidebar-active);}
.nav-item .badge-count{
  margin-left:auto; align-self:center; background:var(--border); color:var(--sidebar-fg);
  font-size:16px; font-weight:700; padding:1px 8px; border-radius:20px;
}
.nav-item.active .badge-count{background:var(--nav-hover-bg); color:var(--sidebar-active);}

.avatar-chip{
  width:32px; height:32px; border-radius:50%; background:var(--btn-primary);
  color:var(--fg-on-dark); display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:700; flex-shrink:0;
}

.main{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--main-bg);}

.topbar{
  height:56px; background:var(--header-bg); color:var(--header-fg);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; flex-shrink:0; position:sticky; top:0; z-index:30;
  box-shadow:var(--shadow-sm);
}
.breadcrumb{font-size:16px; color:rgba(255,255,255,0.7); display:flex; align-items:center; gap:6px;}
.breadcrumb b{color:var(--fg-on-dark); font-weight:600;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.era-toggle{
  font-size:16px; background:rgba(255,255,255,0.12); color:var(--fg-on-dark);
  padding:4px 10px; border-radius:20px; display:flex; align-items:center; gap:6px;
}
.era-toggle b{font-weight:700;}
.topbar-user{font-size:16px; color:rgba(255,255,255,0.85); display:flex; align-items:center; gap:8px;}

.content{padding:var(--space-xl) var(--space-xl) var(--space-3xl); flex:1; width:100%;}
.page{display:none; animation:fadeIn .18s var(--ease-out);}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:var(--space-lg); gap:var(--space-sm); flex-wrap:wrap;}
.page-head h1{font-size:24px; font-weight:700; color:var(--text-primary);}
.page-head .desc{font-size:16px; color:var(--text-secondary); margin-top:4px;}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; gap:9px;
  border-radius:12px; padding:15px 24px; font-size:16.5px; font-weight:600;
  min-height:54px;
  border:1px solid transparent; transition:background-color .12s var(--ease-out), border-color .12s var(--ease-out), box-shadow .12s var(--ease-out); white-space:nowrap;
}
.btn svg{width:19px; height:19px;}
.btn-primary{background:var(--header-bg); color:var(--btn-primary-fg);}
.btn-primary:hover{background:var(--btn-primary);}
.btn-secondary{background:var(--surface); color:var(--text-primary); border-color:var(--border-strong);}
.btn-secondary:hover{background:var(--zebra); border-color:var(--btn-primary);}
.btn-ghost{background:transparent; color:var(--btn-primary); border-color:transparent; padding:9px 10px;}
.btn-ghost:hover{background:var(--card-highlight-bg);}
.btn-danger-ghost{background:transparent; color:var(--st-hold-fg); border-color:var(--st-hold-bd);}
.btn-danger-ghost:hover{background:var(--st-hold-bg);}
.btn-sm{padding:9px 15px; font-size:16px; border-radius:9px; min-height:40px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.icon-btn{
  width:44px; height:44px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text-secondary);
}
.icon-btn:hover{border-color:var(--btn-primary); color:var(--btn-primary); background:var(--card-highlight-bg);}
.icon-btn svg{width:19px; height:19px;}

/* ============================================================
   FORM ELEMENTS
   ============================================================ */
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:18px; font-weight:600; color:var(--text-primary);}
.ro-val{font-size:18px; font-weight:700; color:var(--text-primary); margin-top:2px;}
.field-tag{display:inline-block; font-size:12px; font-weight:700; color:var(--btn-primary); background:var(--card-highlight-bg); padding:2px 9px; border-radius:6px; margin-bottom:5px;}
.field label .req{color:var(--st-hold-fg); margin-left:2px;}
.percent-input-lg{font-size:26px !important; font-weight:800 !important; border:2px solid var(--btn-primary) !important; background:var(--card-highlight-bg) !important;}
.percent-input-lg:disabled{background:var(--zebra) !important; border-color:var(--border) !important; color:var(--text-secondary) !important; font-weight:600 !important;}
.field .hint{font-size:16px; color:var(--text-secondary);}
input[type=text], input[type=date], input[type=number], select, textarea{
  font-family:inherit; font-size:18px; color:var(--text-primary);
  border:1px solid var(--border-strong); border-radius:10px; padding:13px 14px;
  min-height:52px;
  background:var(--surface); width:100%; transition:border-color .12s;
}
input.num-input{font-family:'IBM Plex Mono'; text-align:right; font-size:20px; font-weight:600;}
input:focus, select:focus, textarea:focus{outline:2px solid var(--btn-primary); outline-offset:1px; border-color:var(--btn-primary); box-shadow:0 0 0 3px rgba(0,86,255,0.12);}
input:disabled, .input-locked{background:var(--zebra); color:var(--text-secondary); border-color:var(--border); cursor:not-allowed;}
/* ขาด/เกิน — the ONE field allowed to carry meaningful color (minimal accent rule) */
input.diff-mismatch{color:var(--st-hold-fg); font-weight:700; border-color:var(--st-hold-bd); background:var(--st-hold-bg);}
input.diff-match{color:var(--st-done-fg); font-weight:700; border-color:var(--st-done-bd); background:var(--st-done-bg);}

/* Segmented control — replaces dropdowns for ชนิดหลอม / รูปแบบ */
.seg-control{display:flex; gap:10px; flex-wrap:wrap;}
.seg-btn{
  flex:1; min-width:140px; min-height:56px; border-radius:12px; border:2px solid var(--border-strong);
  background:var(--surface); color:var(--text-primary); font-family:inherit; font-size:18px; font-weight:700;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:border-color .12s var(--ease-out), background .12s var(--ease-out), color .12s var(--ease-out);
}
.seg-btn svg{width:20px; height:20px;}
.seg-btn:hover{border-color:var(--btn-primary);}
.seg-btn.active{border-color:var(--header-bg); background:var(--header-bg); color:var(--fg-on-dark);}
.seg-btn:focus-visible{outline:2px solid var(--btn-primary); outline-offset:2px;}

.search-row{display:flex; gap:var(--space-2xs); align-items:center; flex-wrap:wrap;}
.search-row input{max-width:280px;}
.search-hint{font-size:16px; color:var(--text-secondary); display:flex; align-items:center; gap:6px;}
.search-hint svg{width:15px; height:15px; flex-shrink:0; stroke:var(--text-secondary);}

/* ============================================================
   CARDS / SURFACES
   ============================================================ */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
}
.card-pad{padding:var(--space-md);}
.card-highlight{background:var(--card-highlight-bg); border-color:var(--card-highlight-border);}
.stat-card{
  background:var(--card-highlight-bg); border:1px solid var(--card-highlight-border); border-radius:var(--radius-md);
  padding:14px 16px;
}
.stat-card .label{font-size:16px; color:var(--stat-label); font-weight:600; margin-bottom:8px;}
.stat-card .value{font-size:32px; font-weight:700; color:var(--text-primary);}
.stat-card .value .unit{font-size:16px; font-weight:500; color:var(--text-secondary); margin-left:4px;}

/* ============================================================
   CHOICE CARDS — big selectable option cards (การจัดล็อต landing, etc.)
   ============================================================ */
.choice-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
  gap:var(--space-lg); margin-top:var(--space-md);
}
.choice-card{
  position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:var(--space-2xs);
  text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:var(--space-xl); box-shadow:var(--shadow-sm); cursor:pointer; font-family:inherit;
  transition:border-color .14s var(--ease-out), box-shadow .14s var(--ease-out), transform .14s var(--ease-out);
}
.choice-card:hover{border-color:var(--btn-primary); box-shadow:var(--shadow-md); transform:translateY(-2px);}
.choice-card-badge{
  position:absolute; top:var(--space-md); right:var(--space-md);
  background:var(--card-highlight-bg); color:var(--header-bg); font-weight:700; font-size:15px;
  padding:5px 14px; border-radius:20px;
}
.choice-card-icon{
  width:56px; height:56px; border-radius:14px; background:var(--card-highlight-bg); color:var(--header-bg);
  display:flex; align-items:center; justify-content:center; margin-bottom:var(--space-2xs); flex-shrink:0;
}
.choice-card-icon svg{width:28px; height:28px;}
.choice-card-title{font-size:22px; font-weight:700; color:var(--text-primary);}
.choice-card-desc{font-size:16px; color:var(--text-secondary); line-height:1.4;}

   TABLES
   ============================================================ */
.table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;}
table{width:100%; border-collapse:collapse;}
thead th{
  background:var(--table-head-bg); color:var(--table-head-fg);
  font-size:16px; font-weight:700; text-align:left; padding:14px 16px;
  position:sticky; top:0;
}
thead th.num, thead th.right{text-align:right;}
tbody td{padding:16px; font-size:17px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:nth-child(even){background:var(--zebra);}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--card-highlight-bg);}
td.num, th.num{font-family:'IBM Plex Mono'; text-align:right; font-variant-numeric:tabular-nums; font-weight:700;}
td.right{text-align:right;}
.cell-primary{font-weight:600; color:var(--text-primary);}
.cell-sub{font-size:16px; color:var(--text-secondary); margin-top:1px;}
.table-actions{display:flex; gap:6px; justify-content:flex-end;}
.table-foot{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; font-size:16px; color:var(--text-secondary); border-top:1px solid var(--border);}
.pager{display:flex; gap:4px; align-items:center;}
.pager button{width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--surface); font-size:16px;}
.pager button.active{background:var(--btn-primary); color:var(--fg-on-dark); border-color:var(--btn-primary);}
.empty-row td{text-align:center; padding:40px 16px; color:var(--text-secondary); font-size:16px;}

/* ============================================================
   BADGES — status (fixed triads) + tabs
   ============================================================ */
.badge{
  display:inline-flex; align-items:center; gap:6px;
  font-size:16px; font-weight:700; padding:5px 14px; border-radius:999px;
  border:1px solid transparent; white-space:nowrap;
}
.badge::before{content:''; width:7px; height:7px; border-radius:50%; background:currentColor;}
.badge-progress{background:var(--st-progress-bg); color:var(--st-progress-fg); border-color:var(--st-progress-bd);}
.badge-done{background:var(--st-done-bg); color:var(--st-done-fg); border-color:var(--st-done-bd);}
.badge-hold{background:var(--st-hold-bg); color:var(--st-hold-fg); border-color:var(--st-hold-bd);}
.badge-info{background:var(--st-info-bg); color:var(--st-info-fg); border-color:var(--st-info-bd);}
.badge-sched{background:var(--st-sched-bg); color:var(--st-sched-fg); border-color:var(--st-sched-bd);}

.doc-badge{
  display:inline-flex; align-items:center; font-size:14px; font-weight:700;
  padding:3px 10px; border-radius:999px; border:1px solid transparent; white-space:nowrap; margin-left:8px;
}
.doc-original{background:var(--doc-original-bg); color:var(--doc-original-fg); border-color:var(--doc-original-bd);}
.doc-copy1{background:var(--doc-copy1-bg); color:var(--doc-copy1-fg); border-color:var(--doc-copy1-bd);}
.doc-copy2{background:var(--doc-copy2-bg); color:var(--doc-copy2-fg); border-color:var(--doc-copy2-bd);}

.tpl-pick-card{
  display:flex; align-items:center; gap:14px; text-align:left; width:100%;
  padding:16px 18px; border-radius:14px; border:1px solid var(--border); background:var(--surface);
  cursor:pointer; transition:border-color .12s var(--ease-out), background .12s var(--ease-out);
}
.tpl-pick-card:hover{border-color:var(--btn-primary); background:var(--card-highlight-bg);}
.tpl-pick-icon{
  width:44px; height:44px; border-radius:11px; background:var(--card-highlight-bg); color:var(--header-bg);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.tpl-pick-icon svg{width:22px; height:22px;}
.tpl-pick-text{display:flex; flex-direction:column; gap:3px;}
.tpl-pick-title{font-size:17px; font-weight:700; color:var(--text-primary);}
.tpl-pick-desc{font-size:16px; color:var(--text-secondary);}

/* ============================================================
   SEARCHABLE DROPDOWN (combobox — พิมพ์ค้นหาได้)
   ============================================================ */
.ss-wrap{position:relative;}
.ss-input{width:100%;}
.ss-menu{
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:40;
  background:var(--surface); border:1px solid var(--border-strong); border-radius:10px;
  box-shadow:var(--shadow-md); max-height:240px; overflow-y:auto; padding:6px;
}
.ss-option{
  padding:10px 12px; border-radius:8px; font-size:16px; color:var(--text-primary);
  cursor:pointer; display:flex; align-items:center; justify-content:space-between;
}
.ss-option:hover, .ss-option.active{background:var(--card-highlight-bg); color:var(--btn-primary);}
.ss-option mark{background:var(--doc-original-bg); color:inherit; border-radius:3px; padding:0 1px;}
.ss-empty{padding:12px; text-align:center; font-size:16px; color:var(--text-secondary);}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap; padding-bottom:2px;}
.tab{
  padding:11px 16px; font-size:16px; font-weight:600; color:var(--text-secondary);
  border-bottom:3px solid transparent; cursor:pointer; display:flex; align-items:center; gap:7px;
  margin-bottom:-3px; border-radius:10px 10px 0 0;
  transition:background .12s var(--ease-out), color .12s var(--ease-out);
}
.tab:hover{color:var(--text-primary); background:var(--zebra);}
.tab.active{color:var(--btn-primary); border-bottom-color:var(--btn-primary); background:var(--card-highlight-bg);}
.tab .count{background:var(--surface); border:1px solid var(--border); color:var(--text-secondary); font-size:16px; font-weight:700; padding:1px 6.5px; border-radius:20px;}
.tab.active .count{background:var(--btn-primary); border-color:var(--btn-primary); color:var(--fg-on-dark);}

/* subtab pill style (used inside a page, e.g. Stock) */
.pills{display:flex; gap:8px; margin-bottom:16px;}
.pill{padding:10px 18px; border-radius:20px; font-size:16px; font-weight:600; border:1px solid var(--border-strong); color:var(--text-secondary); cursor:pointer;}
.pill.active{background:var(--btn-primary); border-color:var(--btn-primary); color:var(--fg-on-dark);}

/* ============================================================
   MODALS
   ============================================================ */
.overlay{
  position:fixed; inset:0; background:rgba(0,26,51,0.45); backdrop-filter:blur(2px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:24px;
}
.overlay.active{display:flex;}
.modal{
  background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  width:100%; max-height:88vh; overflow:auto; animation:pop .16s var(--ease-out);
}
@keyframes pop{from{opacity:0; transform:scale(.97);} to{opacity:1; transform:none;}}
.modal-sm{max-width:420px;}
.modal-md{max-width:640px;}
.modal-lg{max-width:920px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:20px; font-weight:700;}
.modal-body{padding:var(--space-lg);}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border); background:var(--zebra);}
.modal-close{width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:var(--text-secondary); border:none; background:transparent;}
.modal-close:hover{background:var(--zebra);}

/* Real preview header — no re-drawn browser chrome (Hallmark: the environment already supplies that) */
.preview-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 18px; border-bottom:1px solid var(--border);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0; background:var(--zebra);
}
.preview-head-title{display:flex; align-items:center; gap:8px; font-size:16px; font-weight:600; color:var(--text-primary);}
.preview-head-title svg{width:15px; height:15px; color:var(--st-hold-fg); flex-shrink:0;}

/* ============================================================
   STEPPER (order wizard)
   ============================================================ */
.stepper{display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap;}
.step-chip{
  flex:1; min-width:170px; background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; display:flex; align-items:center; gap:11px; cursor:pointer;
}
.step-chip .n{
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:700; background:var(--zebra); color:var(--text-secondary); flex-shrink:0;
}
.step-chip .t{font-size:16px; font-weight:700;}
.step-chip .s{font-size:16px; color:var(--text-secondary);}
.step-chip.current{border-color:var(--btn-primary); background:var(--card-highlight-bg);}
.step-chip.current .n{background:var(--btn-primary); color:var(--fg-on-dark);}
.step-chip.current .t{color:var(--btn-primary);}
.step-chip.complete .n{background:var(--st-done-fg); color:var(--fg-on-dark);}
.step-chip.complete .s{color:var(--st-done-fg);}

/* ============================================================
   DASHBOARD — kanban
   ============================================================ */

.kanban{display:flex; gap:14px; overflow-x:auto; padding-bottom:10px;}
.kanban-col{
  flex:0 0 250px; background:var(--kanban-col-bg); border:1px solid var(--border); border-radius:var(--radius-md);
  display:flex; flex-direction:column; max-height:640px;
}
.kanban-col-head{
  padding:12px 14px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border); font-size:16px; font-weight:700;
}
.kanban-col-head .count{background:var(--surface); border:1px solid var(--border-strong); font-size:16px; padding:1px 8px; border-radius:20px; color:var(--text-secondary); font-weight:700;}
.kanban-body{padding:10px; display:flex; flex-direction:column; gap:8px; overflow-y:auto;}
.kcard{
  background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:12px 14px;
  box-shadow:var(--shadow-sm); cursor:pointer; overflow:hidden;
}
.kcard:hover{border-color:var(--btn-primary);}
.kcard .rf{font-size:18px; font-weight:800; color:var(--text-primary);}
.kcard .cust{font-size:16px; color:var(--text-secondary); margin:2px 0 6px; overflow-wrap:anywhere;}
.kcard .lot{font-size:15px; color:var(--text-secondary); margin:-3px 0 6px;}
.kcard .meta{display:flex; justify-content:space-between; align-items:center; font-size:16px; color:var(--text-secondary); gap:8px;}
.kcard .meta .w{font-family:'IBM Plex Mono'; font-weight:600; color:var(--text-primary); white-space:nowrap; flex-shrink:0;}
.kanban-empty{padding:26px 10px; text-align:center; font-size:16px; color:var(--text-secondary);}

/* ============================================================
   TIMELINE (edit history)
   ============================================================ */
.timeline{position:relative; padding-left:26px;}
.timeline::before{content:''; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:var(--border);}
.tl-item{position:relative; padding-bottom:22px; cursor:pointer;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{
  position:absolute; left:-26px; top:2px; width:17px; height:17px; border-radius:50%;
  background:var(--surface); border:2.5px solid var(--btn-primary); z-index:1;
}
.tl-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
.tl-card:hover{border-color:var(--btn-primary); background:var(--card-highlight-bg);}
.tl-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.tl-who{display:flex; align-items:center; gap:8px;}
.tl-who .name{font-size:16px; font-weight:700;}
.tl-when{font-size:16px; color:var(--text-secondary); font-family:'IBM Plex Mono'; white-space:nowrap;}
.tl-desc{font-size:16px; color:var(--text-secondary); margin-top:4px;}
.tl-fields{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.tl-field-chip{font-size:16px; background:var(--zebra); border:1px solid var(--border); padding:2px 8px; border-radius:20px; color:var(--text-secondary);}

/* diff table */
.diff-table{width:100%; border-collapse:collapse; margin-top:6px;}
.diff-table th{font-size:16px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-secondary); text-align:left; padding:8px 10px; border-bottom:1px solid var(--border);}
.diff-table td{padding:10px; font-size:16px; border-bottom:1px solid var(--border); vertical-align:top;}
.diff-old{color:var(--st-hold-fg); text-decoration:line-through; text-decoration-color:var(--st-hold-bd); font-family:'IBM Plex Mono';}
.diff-new{color:var(--st-done-fg); font-weight:600; font-family:'IBM Plex Mono';}
.diff-field{font-weight:600;}

/* ============================================================
   MISC
   ============================================================ */
.divider{height:1px; background:var(--border); margin:20px 0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-sm);}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-sm);}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-sm);}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--text-primary); color:var(--fg-on-dark); padding:12px 20px; border-radius:10px; font-size:16px;
  display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none;
  transition:opacity .22s var(--ease-out), transform .22s var(--ease-out); z-index:200;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast svg{width:16px; height:16px; color:var(--st-done-bd); flex-shrink:0;}
.locked-tag{display:inline-flex; align-items:center; gap:4px; font-size:16px; color:var(--text-secondary); font-weight:600;}
.locked-tag svg{width:11px; height:11px;}
.section-label{font-size:16px; font-weight:700; color:var(--text-primary); margin-bottom:var(--space-2xs); display:flex; align-items:center; gap:var(--space-2xs);}
.trash-toggle{display:flex; align-items:center; gap:7px; font-size:16px; color:var(--text-secondary); cursor:pointer; user-select:none;}
.switch{width:34px; height:19px; border-radius:20px; background:var(--border-strong); position:relative; transition:.15s;}
.switch::after{content:''; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:var(--surface); transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.25);}
.switch.on{background:var(--btn-primary);}
.switch.on::after{left:17px;}
.total-box{background:var(--card-highlight-bg); border:1px solid var(--card-highlight-border); border-radius:10px; padding:14px 18px; min-width:260px;}
.total-row{display:flex; justify-content:space-between; font-size:16px; padding:4px 0; color:var(--text-secondary);}
.total-row.grand{font-size:16px; font-weight:700; color:var(--text-primary); border-top:1px solid var(--card-highlight-border); margin-top:6px; padding-top:8px;}
.total-row span:last-child{font-family:'IBM Plex Mono';}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============================================================
   INVOICE EDIT — FULL PAGE LAYOUT
   ============================================================ */
.inv-page{display:flex; flex-direction:column; gap:0;}
.inv-topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0 18px; gap:16px; flex-wrap:wrap;
}
.inv-topbar-left{display:flex; align-items:center; gap:14px;}
.inv-back{
  width:34px; height:34px; border-radius:9px; border:1px solid var(--border-strong);
  background:var(--surface); display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary); cursor:pointer; flex-shrink:0;
}
.inv-back:hover{border-color:var(--btn-primary); color:var(--btn-primary); background:var(--card-highlight-bg);}
.inv-back svg{width:16px; height:16px;}
.inv-title h1{font-size:20px; margin:0;}
.inv-title .sub{font-size:16px; color:var(--text-secondary); margin-top:2px;}
.inv-topbar-right{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

.inv-header-row{
  display:grid; grid-template-columns: 170px 170px 160px 1fr 1fr 200px;
  gap:12px; margin-bottom:22px; align-items:start;
}
.inv-header-row .field label{font-size:16px; color:var(--text-secondary); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
.inv-header-row input{font-size:16px;}

.inv-body{display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start;}
.inv-left{display:flex; flex-direction:column; gap:16px;}
.inv-right{position:sticky; top:76px; display:flex; flex-direction:column; gap:16px;}

.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm); overflow:hidden;
}
.panel-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 18px; border-bottom:1px solid var(--border); background:var(--zebra);
}
.panel-head .title{display:flex; align-items:center; gap:9px; font-size:20px; font-weight:700;}
.panel-head .title svg{width:18px; height:18px; color:var(--btn-primary);}
.panel-body{padding:var(--space-md);}

/* TDC Approve — per-RF card (replaces a too-wide table) */
.tdc-card{
  background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--header-bg);
  border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); margin-bottom:var(--space-md); overflow:hidden;
}
.tdc-card-head{
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  padding:18px 22px; background:var(--card-highlight-bg); border-bottom:1px solid var(--card-highlight-border);
}
.tdc-card-rf{font-size:22px; font-weight:800; color:var(--header-bg);}
.tdc-card-cust{font-size:16px; color:var(--text-secondary); margin-top:2px;}
.tdc-card-weight{text-align:right;}
.tdc-card-weight .val{font-family:'IBM Plex Mono'; font-size:22px; font-weight:700; color:var(--text-primary);}
.tdc-card-weight .lbl{font-size:14px; color:var(--text-secondary); display:block;}
.tdc-card-body{padding:22px;}
.tdc-info-row{display:flex; flex-wrap:wrap; gap:24px; margin-bottom:18px; font-size:17px;}
.tdc-info-row .item .lbl{font-size:14px; color:var(--text-secondary); display:block; margin-bottom:2px;}
.tdc-info-row .item .val{font-weight:600; color:var(--text-primary);}
.tdc-metal-panel{border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:14px; overflow:hidden;}
.tdc-metal-head{padding:10px 16px; background:var(--zebra); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;}
.tdc-metal-body{padding:16px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:680px){ .tdc-metal-body{grid-template-columns:1fr;} }
.tdc-card-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}

.tdc-gate-banner{
  display:flex; align-items:center; gap:10px; padding:14px 18px; border-radius:var(--radius-md);
  font-size:16px; font-weight:600; border:1px solid transparent;
}
.tdc-gate-banner svg{width:18px; height:18px; flex-shrink:0;}
.tdc-gate-pending{background:var(--st-progress-bg); color:var(--st-progress-fg); border-color:var(--st-progress-bd);}
.tdc-gate-approved{background:var(--st-done-bg); color:var(--st-done-fg); border-color:var(--st-done-bd);}
.tdc-gate-rejected{background:var(--st-hold-bg); color:var(--st-hold-fg); border-color:var(--st-hold-bd);}

/* calc table */
.calc-service-row{margin-bottom:14px;}
.calc-service-row label{font-size:16px; font-weight:600; color:var(--text-secondary); display:block; margin-bottom:6px;}
/* calc rows — no table headers, clean list layout */
.calc-rows{display:flex; flex-direction:column; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-top:12px;}
.calc-row{
  display:grid; grid-template-columns:1fr 180px 56px;
  align-items:center; border-bottom:1px solid var(--border);
}
.calc-row:last-child{border-bottom:none;}
.calc-row:nth-child(even){background:var(--zebra);}
.calc-row-label{
  padding:12px 16px; font-size:16px; color:var(--text-primary);
  display:flex; align-items:center; gap:8px;
}
.calc-row-label.active{color:var(--btn-primary); font-weight:600;}
.calc-row-input{padding:8px 10px; display:flex; justify-content:flex-end;}
.calc-row-input input{
  font-family:'IBM Plex Mono'; font-size:16px; text-align:right;
  border:1px solid var(--border-strong); border-radius:8px; padding:8px 12px;
  width:160px; background:var(--surface); color:var(--text-primary); transition:border-color .12s;
}
.calc-row-input input:focus{outline:2px solid var(--btn-primary); outline-offset:1px; border-color:var(--btn-primary); box-shadow:0 0 0 3px rgba(0,86,255,.12);}
.calc-row-input input.highlight{
  border-color:var(--btn-primary); background:var(--card-highlight-bg); font-weight:600;
}
.calc-unit{padding:12px 14px 12px 4px; font-size:16px; color:var(--text-secondary); white-space:nowrap;}
/* subtotal row — matches reference: light peach bg, large right-aligned number */
.calc-subtotal{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--calc-subtotal-bg); border:1px solid var(--calc-subtotal-border);
  border-radius:10px; padding:14px 20px; margin-top:14px;
}
.calc-subtotal .lbl{font-size:16px; color:var(--calc-subtotal-fg); font-weight:600;}
.calc-subtotal .val{
  font-size:22px; font-weight:700; font-family:'IBM Plex Mono';
  color:var(--text-primary); letter-spacing:-.01em;
}
.calc-subtotal .val .unit{font-size:16px; font-weight:500; color:var(--text-secondary); margin-left:5px;}
/* service label above the rows */
.calc-service-row{margin-bottom:4px;}
.calc-service-row label{font-size:16px; font-weight:600; color:var(--text-secondary); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
.calc-service-row input{font-size:16px; max-width:440px; width:100%;}

/* summary panel */
.summary-currency{font-size:16px; color:var(--text-secondary); text-align:right; margin-bottom:8px;}
.summary-row{display:flex; justify-content:space-between; padding:6px 0; font-size:16px;}
.summary-row span:last-child{font-family:'IBM Plex Mono'; font-weight:500;}
.summary-total-box{
  background:var(--card-highlight-bg); border:1.5px solid var(--btn-primary);
  border-radius:10px; padding:14px 16px; margin-top:10px;
}
.summary-total-label{font-size:16px; color:var(--btn-primary); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
.summary-grand{font-size:24px; font-weight:700; font-family:'IBM Plex Mono'; color:var(--btn-primary);}
.summary-grand-note{font-size:16px; color:var(--text-secondary); margin-top:4px;}
.note-panel textarea{
  width:100%; font-family:'Sarabun'; font-size:16px; color:var(--text-primary);
  border:1px solid var(--border-strong); border-radius:10px; padding:12px 14px;
  resize:vertical; min-height:90px;
}
.note-panel textarea:focus{outline:2px solid var(--btn-primary); outline-offset:1px; border-color:var(--btn-primary); box-shadow:0 0 0 3px rgba(0,86,255,.12);}
.inv-btn-history{
  display:inline-flex; align-items:center; gap:6px; color:var(--btn-primary);
  font-size:16px; font-weight:600; border:1px solid var(--btn-primary);
  background:transparent; border-radius:8px; padding:8px 13px; cursor:pointer;
}
.inv-btn-history:hover{background:var(--card-highlight-bg);}
.inv-btn-history svg{width:14px; height:14px;}
.inv-btn-draft{
  display:inline-flex; align-items:center; gap:6px; color:var(--text-primary);
  font-size:16px; font-weight:600; border:1px solid var(--border-strong);
  background:var(--surface); border-radius:8px; padding:8px 13px; cursor:pointer;
}
.inv-btn-draft:hover{border-color:var(--btn-primary); color:var(--btn-primary);}
.inv-btn-draft svg{width:14px; height:14px;}

/* ============================================================
   DASHBOARD — 3-LANE KANBAN (Flat Design)
   ============================================================ */
.dash-search{
  display:flex; align-items:center; gap:10px; margin-bottom:18px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:10px 14px; box-shadow:var(--shadow-sm); transition:border-color .12s, box-shadow .12s;
}
.dash-search:focus-within{border-color:var(--btn-primary); box-shadow:0 0 0 3px rgba(0,86,255,0.12);}
.dash-search svg{width:16px; height:16px; color:var(--text-secondary); flex-shrink:0;}
.dash-search input{
  flex:1; border:none; outline:none; font-family:inherit; font-size:16px;
  color:var(--text-primary); background:transparent;
}
.dash-search input::placeholder{color:var(--text-secondary);}
.dash-search button{
  background:var(--btn-primary); color:var(--fg-on-dark); border:none; border-radius:7px;
  padding:7px 16px; font-size:16px; font-weight:600; cursor:pointer; font-family:inherit;
}
.dash-search button:hover{background:var(--btn-primary-hover);}

.lane-wrap{display:flex; flex-direction:column; gap:var(--space-lg); margin-top:var(--space-3xs);}
.lane{}
/* Lane label strip — thin, no card box wrapping columns */
.lane-strip{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:0 0 var(--space-xs) 0; border-bottom:2px solid transparent; margin-bottom:var(--space-xs);
}
.lane-strip.lane1{border-bottom-color:var(--btn-primary);}
.lane-strip.lane2{border-bottom-color:var(--st-progress-bd);}
.lane-strip.lane3{border-bottom-color:var(--st-done-bd);}
.lane-badge{
  width:26px; height:26px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:800; color:var(--fg-on-dark); flex-shrink:0; line-height:1;
}
.lane1 .lane-badge{background:var(--btn-primary);}
.lane2 .lane-badge{background:var(--lane2-badge);}
.lane3 .lane-badge{background:var(--st-done-fg);}
.lane-title{font-size:16px; font-weight:700; color:var(--text-primary); line-height:1.3;}
.lane-sub{font-size:16px; color:var(--text-secondary); margin-left:4px; line-height:1.3;}
.lane-total{
  margin-left:auto; font-size:16px; font-weight:700; font-family:'IBM Plex Mono';
  color:var(--text-secondary); white-space:nowrap; line-height:1.3; padding:2px 0;
}
/* columns sit directly under the strip — no wrapping card */
.lane-cols{display:flex; gap:12px; overflow-x:auto; padding:2px var(--space-lg) var(--space-2xs) 2px;}
.lane-col{
  flex:0 0 232px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-md); display:flex; flex-direction:column;
  box-shadow:var(--shadow-sm); min-width:0;
}
.lane-col-head{
  padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border); font-size:16px; font-weight:700; color:var(--text-primary);
  background:var(--soft-blue); border-radius:var(--radius-md) var(--radius-md) 0 0;
}
.lane-col-head .lc-count{
  font-size:15px; font-weight:700; font-family:'IBM Plex Mono';
  background:var(--header-bg); color:var(--fg-on-dark); padding:2px 9px; border-radius:20px;
}
.lane-col-body{padding:8px; display:flex; flex-direction:column; gap:7px; max-height:380px; overflow-y:auto;}
.lane-empty{padding:22px 8px; text-align:center; font-size:16px; color:var(--text-secondary);}

/* ============================================================
   ACCESSIBILITY — focus states + reduced motion (Hallmark discipline)
   ============================================================ */
html,body{overflow-x:clip;}
a:focus-visible, button:focus-visible, .btn:focus-visible, .icon-btn:focus-visible,
.nav-item:focus-visible, .tab:focus-visible, .pill:focus-visible, .kcard:focus-visible,
input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--btn-primary); outline-offset:2px; border-radius:6px;
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important; scroll-behavior:auto !important;
  }
}

/* ============================================================
   MOBILE — hamburger toggle for the sidebar drawer
   ============================================================ */
.menu-toggle{
  display:none; width:36px; height:36px; border-radius:8px; border:none;
  background:rgba(255,255,255,.12); color:var(--fg-on-dark); align-items:center; justify-content:center;
  flex-shrink:0;
}
.menu-toggle svg{width:19px; height:19px;}
.sidebar-scrim{display:none;}

/* ============================================================
   RESPONSIVE — 768 / 414 / 375 / 320 (Hallmark: hard floor, not optional)
   ============================================================ */
@media (max-width:768px){
  .menu-toggle{display:inline-flex;}
  .app{position:relative;}
  .sidebar{
    position:fixed; left:0; top:0; z-index:60; transform:translateX(-100%);
    transition:transform .18s var(--ease-out, ease-out); box-shadow:var(--shadow-lg);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-scrim{
    display:none; position:fixed; inset:0; background:rgba(0,26,51,.4); z-index:55;
  }
  .sidebar-scrim.open{display:block;}
  .content{padding:18px 16px 48px;}
  .grid-2, .grid-3, .grid-4{grid-template-columns:1fr;}
  .inv-body{grid-template-columns:1fr;}
  .inv-right{position:static; top:auto;}
  .inv-header-row{grid-template-columns:1fr 1fr;}
  .calc-row{grid-template-columns:1fr; row-gap:4px;}
  .calc-row-input{justify-content:flex-start;}
  .calc-row-input input{width:100%;}
  .page-head{flex-direction:column; align-items:flex-start;}
  .lane-cols, .kanban{
    scroll-snap-type:x mandatory; scroll-padding-left:2px;
  }
  .lane-col, .kanban-col{
    scroll-snap-align:start; scroll-snap-stop:always;
    flex:0 0 min(300px, 82vw);
  }
}
@media (max-width:414px){
  body{font-size:16px;}
  .content{padding:14px 12px 40px;}
  .btn{width:100%; justify-content:center;}
  .inv-header-row{grid-template-columns:1fr;}
  .page-head h1{font-size:21px;}
  .stat-card .value{font-size:26px;}
  .search-row input{max-width:none; width:100%;}
}
@media (max-width:375px){
  .lane-col, .kanban-col{flex:0 0 86vw;}
}
@media (max-width:320px){
  .content{padding:12px 10px 36px;}
}

function wfNum(v){ const n = parseFloat(String(v).replace(/,/g,'')); return Number.isFinite(n) ? n : 0; }
function wfRound2(v){ if(!Number.isFinite(v)) return 0; return Math.round((v + Number.EPSILON) * 100) / 100; }
function wfSafeDiv(a,b){ if(!b) return 0; const r=a/b; return Number.isFinite(r) ? r : 0; }
function wfFmt(v){ return Number.isFinite(v) ? v.toFixed(2) : '0.00'; }
function todayStr(){
  const d = new Date();
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+(d.getFullYear()+543);
}
function wfIsValidRfNo(rf){
  return /^RF-2569-\d{4}$/.test(String(rf||'').trim());
}
function wfParseThaiDate(str){
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(str||'').trim());
  if(!m) return null;
  return parseInt(m[3],10)*10000 + parseInt(m[2],10)*100 + parseInt(m[1],10);
}
function wfIsFutureDate(str){
  const d = wfParseThaiDate(str), t = wfParseThaiDate(todayStr());
  if(d==null || t==null) return false;
  return d > t;
}

const WfFormula = {
  diffWeight(declared, received){ return wfRound2(wfNum(declared) - wfNum(received)); },
  shortage(afterMelt, sample, custSample, received){
    return wfRound2((wfNum(afterMelt) + wfNum(sample) + wfNum(custSample)) - wfNum(received));
  },
  auCalculatedWeight(weightAfterMeltAu, percentAu){ return wfRound2(wfSafeDiv(wfNum(weightAfterMeltAu) * wfNum(percentAu), 100)); },
  auReturnWeight(auCalc, returnPercent){ return wfRound2(wfSafeDiv(wfNum(auCalc) * wfNum(returnPercent), 100)); },
  auRemark(auCalc, auReturn){ return wfRound2(wfNum(auCalc) - wfNum(auReturn)); },
  agCalculatedWeight(metalType, weightAfterMeltAu, weightAfterMeltAg, percentAg){
    const base = metalType === 'silver' ? wfNum(weightAfterMeltAg) : wfNum(weightAfterMeltAu);
    return wfRound2(wfSafeDiv(base * wfNum(percentAg), 100));
  },
  agReturnWeight(agCalc, returnPercent){ return wfRound2(wfSafeDiv(wfNum(agCalc) * wfNum(returnPercent), 100)); },
  agServiceFee(receivedWeight){ return wfRound2(wfSafeDiv(wfNum(receivedWeight), 1000) * 200); },
  agRemark(agCalc, agReturn){ return wfRound2(wfNum(agCalc) - wfNum(agReturn)); },
  rowAuGrams(billWeight, percentAu){ return wfRound2(wfSafeDiv(wfNum(billWeight) * wfNum(percentAu), 100)); },
  rowAgGrams(billWeight, percentAg){ return wfRound2(wfSafeDiv(wfNum(billWeight) * wfNum(percentAg), 100)); },
  meltShortage(afterMelt99, beforeMelt99){ return wfRound2(wfNum(afterMelt99) - wfNum(beforeMelt99)); },
  sum(arr){ return wfRound2(arr.reduce((s,v)=>s+wfNum(v), 0)); },
};

function buildRfSummaryData(rf){

  const received = wfNum(rec.w ?? rec.wDeclared);
  const meltedAu = received;
  const sampleAu = wfRound2(received * 0.01);
  const custSampleAu = sampleAu;
  const percentAu = wfNum(rec.percentAu) || 96.50;
  const percentAg = wfNum(rec.percentAg) || 0;
  const auCalc = WfFormula.auCalculatedWeight(meltedAu, percentAu);
  const auReturnPercent = 95;
  const auReturn = WfFormula.auReturnWeight(auCalc, auReturnPercent);
  return {
    rfNo: rf, metalType: percentAg>0 ? 'silver' : 'gold',
    station1: {
      rfNo:rf, receiveDate: rec.date||todayStr(), customerName: rec.cust||'', metalType: percentAg>0?'silver':'gold',
      declaredWeight:declared, receivedWeight:received, diffWeight: WfFormula.diffWeight(declared, received),

}

/* ---------- EXPORT EXCEL (CSV — opens natively in Excel) ---------- */
function exportCSV(filename, headers, rows){
  const escCsv = (v)=>{
    const s = String(v==null?'':v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const lines = [headers.map(escCsv).join(','), ...rows.map(r=>r.map(escCsv).join(','))];
  const csv = '\uFEFF' + lines.join('\r\n'); // BOM so Excel renders Thai correctly
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- SEARCHABLE DROPDOWN (combobox) ---------- */
function initSearchableSelect(inputEl, hiddenEl, menuEl, options, onSelect){
  if(!inputEl || !hiddenEl || !menuEl) return;
  let activeIdx = -1;
  let filtered = options.slice();

  function highlight(text, query){
    if(!query) return esc(text);
    const idx = text.toLowerCase().indexOf(query.toLowerCase());
    if(idx===-1) return esc(text);
    return esc(text.slice(0,idx)) + '<mark>' + esc(text.slice(idx, idx+query.length)) + '</mark>' + esc(text.slice(idx+query.length));
  }

  function render(query){
    filtered = options.filter(o=>o.toLowerCase().includes((query||'').toLowerCase()));
    activeIdx = filtered.length ? 0 : -1;
    menuEl.innerHTML = filtered.length
      ? filtered.map((o,i)=>`<div class="ss-option ${i===activeIdx?'active':''}" data-ss-idx="${i}">${highlight(o, query)}</div>`).join('')
      : `<div class="ss-empty">ไม่พบรายการที่ค้นหา</div>`;
    menuEl.hidden = false;
    inputEl.setAttribute('aria-expanded','true');
  }

  function close(){
    menuEl.hidden = true;
    inputEl.setAttribute('aria-expanded','false');
  }

  function select(value){
    hiddenEl.value = value;
    inputEl.value = value;
    close();
    if(onSelect) onSelect(value);
  }

  inputEl.addEventListener('focus', ()=>render(inputEl.value));
  inputEl.addEventListener('input', ()=>render(inputEl.value));
  inputEl.addEventListener('keydown', (e)=>{
    if(menuEl.hidden && (e.key==='ArrowDown' || e.key==='ArrowUp')){ render(inputEl.value); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); activeIdx = Math.min(activeIdx+1, filtered.length-1); updateActive(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); updateActive(); }
    else if(e.key==='Enter'){ if(!menuEl.hidden && filtered[activeIdx]){ e.preventDefault(); select(filtered[activeIdx]); } }
    else if(e.key==='Escape'){ close(); }
  });
  function updateActive(){
    $$('.ss-option', menuEl).forEach((el,i)=>el.classList.toggle('active', i===activeIdx));
    const activeEl = menuEl.children[activeIdx];
    if(activeEl && activeEl.scrollIntoView) activeEl.scrollIntoView({block:'nearest'});
  }
  menuEl.addEventListener('mousedown', (e)=>{
    const opt = e.target.closest('[data-ss-idx]');
    if(opt) select(filtered[parseInt(opt.dataset.ssIdx)]);
  });
  document.addEventListener('click', (e)=>{
    if(!inputEl.contains(e.target) && !menuEl.contains(e.target)) close();
  });
}

/* ============================================================
   WORKFLOW — Confirmation Modal (ผู้รับ / ผู้ส่ง)
   ============================================================ */
const WF_STAFF = ['สมชาย ช่างทอง', 'วิไล ช่างเงิน', 'ประยุทธ เจ้าหน้าที่คลัง', 'อรทัย เจ้าหน้าที่บัญชี', 'ณัฐวุฒิ หัวหน้าไลน์ผลิต'];
function wfOpenConfirmModal({title, receiverLabel, senderLabel, senderName, onConfirm}){
  openModal(`
    <div class="modal modal-sm">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close" data-close-modal>${iconX()}</button></div>
      <div class="modal-body" style="display:flex; flex-direction:column; gap:14px;">
        <div class="field">
          <label>${esc(receiverLabel)}<span class="req">*</span></label>
          <select id="wfModalReceiver">
            <option value="">เลือกผู้รับ</option>
            ${WF_STAFF.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>${esc(senderLabel)}</label>
          <input type="text" class="input-locked" value="${esc(senderName || 'เจ้าหน้าที่ระบบ (Current User)')}" disabled>
        </div>
      </div>
      <div class="modal-foot"><button class="btn btn-secondary" data-close-modal>ยกเลิก</button><button class="btn btn-primary" id="wfModalConfirmBtn">ยืนยัน</button></div>
    </div>`);
  bindModalEvents();
  const btn = $('#wfModalConfirmBtn');
  if(btn) btn.addEventListener('click', ()=>{
    const receiver = $('#wfModalReceiver').value;
    if(!receiver){ toast('กรุณาเลือกผู้รับก่อนยืนยัน'); return; }
    closeModal();
    onConfirm(receiver);
  });
}

/* ============================================================
   WORKFLOW — event binding
   ============================================================ */
function wfRecalcStation4(){
  const s4=order.station4, s2=order.station2, s3=order.station3, s1=order.station1;
  s4.auCalculatedWeight = WfFormula.auCalculatedWeight(s2.weightAfterMeltAu, s3.percentAu);
  s4.auReturnWeight = WfFormula.auReturnWeight(s4.auCalculatedWeight, s4.auReturnPercent);
  s4.auRemark = WfFormula.auRemark(s4.auCalculatedWeight, s4.auReturnWeight);
  s4.agCalculatedWeight = WfFormula.agCalculatedWeight(order.metalType, s2.weightAfterMeltAu, s2.weightAfterMeltAg, s3.percentAg);
  s4.agReturnWeight = WfFormula.agReturnWeight(s4.agCalculatedWeight, s4.agReturnPercent);
  s4.agServiceFee = WfFormula.agServiceFee(s1.receivedWeight);
  s4.agRemark = WfFormula.agRemark(s4.agCalculatedWeight, s4.agReturnWeight);
}
function wfSyncStation4Fields(){
  const map = {auCalculatedWeight:'wf_s4_auCalculatedWeight', auReturnWeight:'wf_s4_auReturnWeight', auRemark:'wf_s4_auRemark',
    agCalculatedWeight:'wf_s4_agCalculatedWeight', agReturnWeight:'wf_s4_agReturnWeight', agServiceFee:'wf_s4_agServiceFee', agRemark:'wf_s4_agRemark'};
  Object.entries(map).forEach(([k,id])=>{ const el=$('#'+id); if(el) el.value = wfFmt(order.station4[k]); });
}

function wfBindStationEvents(){
  // Shared "บันทึก" (save draft) button — persists current input without advancing the station
  const saveDraftBtn = $('[data-wf-save-draft]');
  if(saveDraftBtn) saveDraftBtn.addEventListener('click', ()=>{
    wfSyncAll();
    toast(`บันทึกข้อมูล "${saveDraftBtn.dataset.wfSaveDraft}" เรียบร้อย`);
  });


  // Station 1
  $$('#wf_s1_metalType_seg .seg-btn').forEach(btn=>btn.addEventListener('click', ()=>{
    order.station1.metalType = btn.dataset.segValue;
    order.metalType = btn.dataset.segValue || null;
    $$('#wf_s1_metalType_seg .seg-btn').forEach(b=>b.classList.toggle('active', b===btn));
  }));
  ['wf_s1_rfNo','wf_s1_detail'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('input', ()=>{ order.station1[id.replace('wf_s1_','')] = el.value; if(id==='wf_s1_rfNo') order.rfNo = el.value; });
  });
  $$('#wf_s1_jobFormat_seg .seg-btn').forEach(btn=>btn.addEventListener('click', ()=>{
    order.station1.jobFormat = btn.dataset.segValue;
    order.jobType = btn.dataset.segValue || null;
    $$('#wf_s1_jobFormat_seg .seg-btn').forEach(b=>b.classList.toggle('active', b===btn));
  }));
  const s1Cust = $('#wf_s1_customerName');
  if(s1Cust) s1Cust.addEventListener('change', ()=>{ order.station1.customerName = s1Cust.value; });
  ['wf_s1_declaredWeight','wf_s1_receivedWeight'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('input', ()=>{
      order.station1[id.replace('wf_s1_','')] = el.value;
      order.station1.diffWeight = WfFormula.diffWeight(order.station1.declaredWeight, order.station1.receivedWeight);
      const diffEl = $('#wf_s1_diffWeight');
      diffEl.value = wfFmt(order.station1.diffWeight);
      wfPaintDiffField(diffEl, order.station1.diffWeight === 0);
    });
  });
  const btnNext1 = $('#wf_btnNext1');
  if(btnNext1) btnNext1.addEventListener('click', ()=>{
    if(!order.station1.rfNo || !order.station1.customerName || !order.station1.metalType || order.station1.declaredWeight==null || order.station1.receivedWeight==null || !order.station1.jobFormat){
      toast('กรุณากรอกข้อมูลที่มี * ให้ครบก่อน'); return;
    }
    if(!wfIsValidRfNo(order.station1.rfNo)){
      toast('รูปแบบ RF No ไม่ถูกต้อง — ต้องเป็น RF-2569-xxxx (ตัวเลข 4 หลัก)'); return;
    }
    if(wfIsFutureDate(order.station1.receiveDate)){
      toast('วันที่รับต้องไม่เกินวันที่ปัจจุบัน'); return;
    }
    wfOpenConfirmModal({title:'ยืนยันขั้นตอนถัดไป — Station 1 → 2', receiverLabel:'ผู้รับ (ช่างหลอม)', senderLabel:'ผู้ส่ง',
      onConfirm:(receiver)=>{
        order.station2.smelterName = receiver;
        state.wfMaxUnlocked = Math.max(state.wfMaxUnlocked, 2); state.wfCurrent = 2;
        wfSyncAll(); toast('ยืนยันส่งต่อ Station 2 เรียบร้อย'); wfRefresh();
      }});
  });
  const btnCancel1 = $('#wf_btnCancel1'); if(btnCancel1) btnCancel1.addEventListener('click', ()=>toast('ยกเลิก RF-No: '+order.rfNo));

  // Station 2
  ['wf_s2_weightAfterMeltAu','wf_s2_sampleWeightAu','wf_s2_customerSampleWeightAu','wf_s2_drossAu','wf_s2_weightAfterMeltAg','wf_s2_sampleWeightAg','wf_s2_customerSampleWeightAg','wf_s2_drossAg'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('input', ()=>{
      order.station2[id.replace('wf_s2_','')] = el.value;
      order.station2.shortageAu = WfFormula.shortage(order.station2.weightAfterMeltAu, order.station2.sampleWeightAu, order.station2.customerSampleWeightAu, order.station1.receivedWeight);
      order.station2.shortageAg = WfFormula.shortage(order.station2.weightAfterMeltAg, order.station2.sampleWeightAg, order.station2.customerSampleWeightAg, order.station1.receivedWeight);
      const shortAuEl = $('#wf_s2_shortageAu'); shortAuEl.value = wfFmt(order.station2.shortageAu); wfPaintDiffField(shortAuEl, order.station2.shortageAu===0);
      const shortAgEl = $('#wf_s2_shortageAg'); shortAgEl.value = wfFmt(order.station2.shortageAg); wfPaintDiffField(shortAgEl, order.station2.shortageAg===0);
    });
  });
  const btnNext2 = $('#wf_btnNext2');
  if(btnNext2) btnNext2.addEventListener('click', ()=>{
    wfOpenConfirmModal({title:'ยืนยันขั้นตอนถัดไป — Station 2 → 3', receiverLabel:'ผู้รับ (ช่างทดสอบ)', senderLabel:'ผู้ส่ง',
      onConfirm:(receiver)=>{
        order.station3.testerName = receiver;
        state.wfMaxUnlocked = Math.max(state.wfMaxUnlocked, 3); state.wfCurrent = 3;
        wfSyncAll(); toast('ยืนยันส่งต่อ Station 3 เรียบร้อย'); wfRefresh();
      }});
  });
  const btnCancel2 = $('#wf_btnCancel2'); if(btnCancel2) btnCancel2.addEventListener('click', ()=>toast('ยกเลิก RF-No: '+order.rfNo));

  // Station 3
  ['wf_s3_percentAu','wf_s3_percentAg'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('input', ()=>{ order.station3[id.replace('wf_s3_','')] = el.value; });
  });
  const btnSendTdc3 = $('#wf_btnSendTdc3');
  if(btnSendTdc3) btnSendTdc3.addEventListener('click', ()=>{
    if(order.station3.percentAu == null || order.station3.percentAu === ''){
      toast('กรุณากรอก % Au ก่อนส่งอนุมัติ'); return;
    }
    order.percentApproval.status = 'pending';
    order.percentApproval.decidedBy = null; order.percentApproval.decidedAt = null;
    wfSyncAll();
    toast('ส่ง %Au/%Ag ให้ TDC อนุมัติแล้ว');
    renderSidebar();
    wfRefresh();
  });
  const btnNext3 = $('#wf_btnNext3');
  if(btnNext3) btnNext3.addEventListener('click', ()=>{
    wfRecalcStation4();
    wfOpenConfirmModal({title:'ยืนยันขั้นตอนถัดไป — Station 3 → 4', receiverLabel:'ผู้รับ', senderLabel:'ผู้ส่ง',
      onConfirm:()=>{ state.wfMaxUnlocked=Math.max(state.wfMaxUnlocked,4); state.wfCurrent=4; wfSyncAll(); toast('ยืนยันส่งต่อ Station 4 เรียบร้อย'); wfRefresh(); }});
  });
  const btnCancel3 = $('#wf_btnCancel3'); if(btnCancel3) btnCancel3.addEventListener('click', ()=>toast('ยกเลิก RF-No: '+order.rfNo));

  // Station 4
  ['wf_s4_auReturnPercent','wf_s4_agReturnPercent','wf_s4_laborFee'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('input', ()=>{ order.station4[id.replace('wf_s4_','')] = el.value; wfRecalcStation4(); wfSyncStation4Fields(); });
  });
  const btnRecalc4 = $('#wf_btnRecalc4'); if(btnRecalc4) btnRecalc4.addEventListener('click', ()=>{ wfRecalcStation4(); wfSyncStation4Fields(); toast('คำนวณ Station 4 ใหม่แล้ว'); });
  const btnNext4 = $('#wf_btnNext4');
  if(btnNext4) btnNext4.addEventListener('click', ()=>{
    wfOpenConfirmModal({title:'ยืนยันเสร็จสิ้นระดับ RF — พร้อมเข้าสู่การจัดล็อต', receiverLabel:'ผู้รับ (เจ้าหน้าที่จัดล็อต)', senderLabel:'ผู้ส่ง', senderName:'เจ้าหน้าที่ (Current User)',
      onConfirm:()=>{
        wfSyncAll();
        const jobType = order.station1.jobFormat === 'pellet' ? 'pellet' : 'bar';
        toast(`บันทึก ${order.rfNo} เสร็จสิ้นระดับ RF เรียบร้อย — เข้าสู่การจัดล็อตแบบ${jobType==='pellet'?'เม็ด':'แท่ง'}อัตโนมัติ`);
        state.wfStepperLimit = null;
        openLotAllocateView(jobType);
      }});
  });

  // Station 5
  $$('[data-wf-s5-row]').forEach(el=>el.addEventListener('input', ()=>{
    const i=parseInt(el.dataset.wfS5Row); order.station5.lotItems[i].weighedBeforeRolling = el.value;
    wfRecalcStation5Summary(); wfRefresh();
  }));
  const btnNext5 = $('#wf_btnNext5');
  if(btnNext5) btnNext5.addEventListener('click', ()=>{
    wfOpenConfirmModal({title:'ยืนยันส่งรีด — Station 5 → 6', receiverLabel:'ผู้รับ - ก่อนส่งรีด (ช่าง)', senderLabel:'ผู้ส่ง - ก่อนส่งรีด', senderName:'เจ้าหน้าที่ (Current User)',
      onConfirm:(receiver)=>{
        order.station5.confirmation.receiverName = receiver;
        state.wfMaxUnlocked=Math.max(state.wfMaxUnlocked,6); state.wfCurrent=6;
        wfSyncAll(); toast('ยืนยันส่งรีดเรียบร้อย'); wfRefresh();
      }});
  });

  // Station 6
  $$('[data-wf-s6-damage]').forEach(el=>el.addEventListener('click', ()=>{
    const i=parseInt(el.dataset.wfS6Damage); const row=order.station5.lotItems[i]; row.damaged=true;
    wfRecalcStation5Summary(); order.station6.sumWeighedAfterRolling = order.station5.summary.sumWeighedWeight;
    toast(`ตัด ${row.rfNo} ออกจาก Lot แล้ว — คำนวณผลรวมใหม่`); wfRefresh();
  }));
  const s6Sum = $('#wf_s6_sum'); if(s6Sum) s6Sum.addEventListener('input', ()=>{ order.station6.sumWeighedAfterRolling = s6Sum.value; });
  const btnNext6 = $('#wf_btnNext6');
  if(btnNext6) btnNext6.addEventListener('click', ()=>{
    wfOpenConfirmModal({title:'ยืนยันขั้นตอนถัดไป — Station 6 → 7', receiverLabel:'ผู้รับ - ก่อนส่งรีด (ช่าง)', senderLabel:'ผู้ส่ง', senderName:'เจ้าหน้าที่ (Current User)',
      onConfirm:(receiver)=>{
        order.station6.confirmation.receiverName = receiver;
        state.wfMaxUnlocked=Math.max(state.wfMaxUnlocked,7); state.wfCurrent=7;
        wfSyncAll(); toast('ยืนยันส่งต่อ Station 7 เรียบร้อย'); wfRefresh();
      }});
  });

  // Station 7
  $$('[data-wf-s7-row]').forEach(el=>el.addEventListener('input', ()=>{
    const active = order.station5.lotItems.filter(r=>!r.damaged);
    const i = parseInt(el.dataset.wfS7Row);
    if(active[i]) active[i].weighedBeforeExtraction = el.value;
  }));
  const s7Table = $('#wf_s7_table'); if(s7Table) s7Table.addEventListener('input', ()=>{ order.station7.weighedBeforeExtractionTable = s7Table.value; });
  const s7Panel = $('#wf_s7_panel'); if(s7Panel && !s7Panel.disabled) s7Panel.addEventListener('input', ()=>{ order.station7.panel.sumWeighedBeforeExtraction = s7Panel.value; });
  const btnNext7 = $('#wf_btnNext7');
  if(btnNext7) btnNext7.addEventListener('click', ()=>{
    wfOpenConfirmModal({title:'ยืนยันขั้นตอนถัดไป — Station 7 → 8', receiverLabel:'ผู้รับ', senderLabel:'ผู้ส่ง', senderName:'เจ้าหน้าที่ (Current User)',
      onConfirm:(receiver)=>{
        order.station7.confirmation.receiverName = receiver;
        state.wfMaxUnlocked=Math.max(state.wfMaxUnlocked,8); state.wfCurrent=8;
        wfSyncAll(); toast('ยืนยันส่งต่อ Station 8 เรียบร้อย'); wfRefresh();
      }});
  });

  // Station 8
  $$('[data-wf-s8-au]').forEach(el=>el.addEventListener('input', ()=>{ const i=parseInt(el.dataset.wfS8Au); order.station8.rows[i].percentAu = el.value; wfRefresh(); }));
  $$('[data-wf-s8-ag]').forEach(el=>el.addEventListener('input', ()=>{ const i=parseInt(el.dataset.wfS8Ag); order.station8.rows[i].percentAg = el.value; wfRefresh(); }));
  const s8Au = $('#wf_s8_machineAu'); if(s8Au) s8Au.addEventListener('input', ()=>{ order.station8.panel.inputThroughMachineAu = s8Au.value; });
  const s8Ag = $('#wf_s8_machineAg'); if(s8Ag) s8Ag.addEventListener('input', ()=>{ order.station8.panel.inputThroughMachineAg = s8Ag.value; });
  const btnNext8 = $('#wf_btnNext8');
  if(btnNext8) btnNext8.addEventListener('click', ()=>{
    wfOpenConfirmModal({title:'ยืนยันขั้นตอนถัดไป — Station 8 → 9', receiverLabel:'ผู้รับ', senderLabel:'ผู้ส่ง', senderName:'เจ้าหน้าที่ (Current User)',
      onConfirm:(receiver)=>{
        order.station8.confirmation.receiverName = receiver;
        state.wfMaxUnlocked=Math.max(state.wfMaxUnlocked,9); state.wfCurrent=9;
        wfSyncAll(); toast('ยืนยันส่งต่อ Station 9 เรียบร้อย'); wfRefresh();
      }});
  });

  // Station 9
  ['wf_s9_afterMelt99Au','wf_s9_drossAu','wf_s9_afterMelt99Ag','wf_s9_drossAg'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    const key = {wf_s9_afterMelt99Au:'sumWeighedAfterMelt99Au', wf_s9_drossAu:'drossWeightAu', wf_s9_afterMelt99Ag:'sumWeighedAfterMelt99Ag', wf_s9_drossAg:'drossWeightAg'}[id];
    el.addEventListener('input', ()=>{
      order.station9.panel[key] = el.value;
      order.station9.panel.shortageGramsAu = WfFormula.meltShortage(order.station9.panel.sumWeighedAfterMelt99Au, order.station8.panel.sumBeforeMelt99Au);
      order.station9.panel.shortageGramsAg = WfFormula.meltShortage(order.station9.panel.sumWeighedAfterMelt99Ag, order.station8.panel.sumBeforeMelt99Ag);
      const shortageAuEl = $('#wf_s9_shortageAu'); if(shortageAuEl){ shortageAuEl.value = wfFmt(order.station9.panel.shortageGramsAu); wfPaintDiffField(shortageAuEl, order.station9.panel.shortageGramsAu===0); }
      const shortageAgEl = $('#wf_s9_shortageAg'); if(shortageAgEl){ shortageAgEl.value = wfFmt(order.station9.panel.shortageGramsAg); wfPaintDiffField(shortageAgEl, order.station9.panel.shortageGramsAg===0); }
    });
  });
  const btnClose9 = $('#wf_btnClose9');
  if(btnClose9) btnClose9.addEventListener('click', ()=>{
    wfOpenConfirmModal({title:'ยืนยันปิดงาน — Station 9', receiverLabel:'ผู้ปิดงาน', senderLabel:'ผู้ส่ง', senderName:'เจ้าหน้าที่ (Current User)',
      onConfirm:(receiver)=>{
        order.station9.closeJob.closedBy = receiver; order.station9.closeJob.closedAt = new Date().toLocaleString('th-TH');
        wfSyncAll();
        toast(`ปิดงาน ${order.rfNo} เรียบร้อย — จบกระบวนการ`);
        goPage('orders');
      }});
  });


  const btnApprove10 = $('#wf_btnApprove10');
  if(btnApprove10) btnApprove10.addEventListener('click', ()=>{
    order.station10.decision = 'approved'; order.station10.decidedAt = new Date().toLocaleString('th-TH');
    wfSyncAll(); toast('อนุมัติ Order เรียบร้อย — จบกระบวนการ'); wfRefresh();
  });
  const btnReject10 = $('#wf_btnReject10');
  if(btnReject10) btnReject10.addEventListener('click', ()=>{
    order.station10.decision = 'rejected'; order.station10.decidedAt = new Date().toLocaleString('th-TH');
    toast('ปฏิเสธ Order แล้ว'); wfRefresh();
  });
}

function renderPage(){

    'lot-manage': pageLotManage,

    stock: pageStock,
    accounting: pageAccounting,
    history: pageHistory,
    users: pageUsers,
    'invoice-edit': pageInvoiceEdit,
    report: pageReport,
    'tdc-approve': pageTdcApprove,
    workflow: pageWorkflow,
    'rf-summary': ()=>pageRfSummary(state.rfSummaryTarget),
  };
  c.innerHTML = builders[state.page] ? builders[state.page]() : '<div>ไม่พบหน้า</div>';

    wfRefresh();
    const btnBack = $('[data-action="wf-back"]');
    if(btnBack) btnBack.addEventListener('click', ()=>{ wfSyncAll(); goPage('orders'); });

}

    <div class="lane-col-body">

        <div class="kcard" data-detail="${esc(it.rf)}">

          <div class="cust">${esc(it.cust)}</div>
          ${it.lot ? `<div class="lot num">${esc(it.lot)}</div>` : ''}
          <div class="meta"><span>${esc(it.date)}</span><span class="w">${esc(it.w)} g</span></div>
        </div>`).join('')}
    </div>

  const closedHtml = closedSpecial;

  return `
    <div class="page-head">
      <div>
        <h1>ภาพรวม</h1>
        <div class="desc">ภาพรวมสถานะทองตลอดสายการผลิต — แบ่ง 3 เลนตามกระบวนการจริง</div>
      </div>
      <button class="btn btn-primary" data-action="new-order">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        สร้าง Order
      </button>

    <div class="dash-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="ค้นหา RF No / ลูกค้า...">
      <button data-action="manual-search">ค้นหา</button>

    <!-- 3-LANE KANBAN -->

/* ============================================================
   ORDERS
   ============================================================ */
function pageOrders(){
  // map each tab key -> the station number it represents (via WF_STATIONS), if any
  const tabToStation = {};
  WF_STATIONS.forEach(s=>{ tabToStation[s.key] = s.n; });

  function matchesTab(o, tabKey){
    if(tabKey==='all') return !o.cancelled;
    if(tabKey==='cancel') return !!o.cancelled;
    if(o.cancelled) return false;
    return o.station === tabToStation[tabKey];
  }

  const visible = ORDERS.filter(o=>matchesTab(o, state.orderTab));

  const rows = visible.map(o=>`
    <tr class="clickable" data-detail="${esc(o.rf)}">
      <td class="cell-primary">${esc(o.rf)}</td>
      <td>${esc(o.date)}</td>
      <td>${esc(o.cust)}</td>
      <td class="num">${esc(o.w)} g</td>
      <td><span class="badge badge-${o.status}">${esc(o.statusLabel)}</span></td>
      <td class="right">
        <div class="table-actions">
          <button class="icon-btn" title="ดูรายละเอียด" data-detail="${esc(o.rf)}">${iconEye()}</button>
          ${o.cancelled ? '' : `<button class="icon-btn" title="ยกเลิก Order" data-action="cancel-order" data-rf="${esc(o.rf)}">${iconTrash()}</button>`}
        </div>
      </td>
    </tr>`).join('');

  return `
    <div class="page-head">
      <div><h1>รายการสั่งซื้อ</h1><div class="desc">รายการ Order ทองทั้งหมด แยกตามสถานะการดำเนินงาน</div></div>
      <button class="btn btn-primary" data-action="new-order">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        สร้าง Order
      </button>
    </div>

    <div class="search-row" style="margin-bottom:16px;">
      <input type="text" placeholder="ค้นหา RF No / ลูกค้า" style="max-width:260px;">
      <input type="text" placeholder="ช่วงวันที่" value="" style="max-width:190px;">
      <button class="btn btn-secondary" data-action="manual-search">${iconSearch()} ค้นหา</button>
    </div>

    <div class="tabs">
      ${ORDER_TABS.map(t=>{
        const n = ORDERS.filter(o=>matchesTab(o, t.key)).length;
        return `<div class="tab ${state.orderTab===t.key?'active':''}" data-tab="order" data-key="${t.key}">${esc(t.label)}<span class="count">${n}</span></div>`;
      }).join('')}
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>RF No</th><th>วันที่รับ</th><th>ลูกค้า</th><th class="num">น้ำหนักรับ</th><th>สถานะ</th><th class="right">จัดการ</th></tr></thead>
        <tbody>${rows || `<tr class="empty-row"><td colspan="6">ไม่พบรายการในสถานะนี้</td></tr>`}</tbody>
      </table>
      <div class="table-foot">
        <span>แสดง ${visible.length ? 1 : 0}-${visible.length} จาก ${visible.length} รายการ</span>
        <div class="pager"><button>‹</button><button class="active">1</button><button>›</button></div>
      </div>
    </div>
  `;
}

/* ---------- ORDER CREATE WIZARD ---------- */
function orderWizardModal(){
  const steps = [
    {n:1, t:'รับงาน', s:'กำลังทำ'},
    {n:2, t:'ส่งหลอม', s:'ยังไม่ถึง'},
    {n:3, t:'ทดสอบ %', s:'ยังไม่ถึง'},
    {n:4, t:'คิดค่าใช้จ่าย (หักทอง)', s:'ยังไม่ถึง'},
    {n:5, t:'ส่งให้ TDC', s:'ยังไม่ถึง'},
  ];
  const chips = steps.map(s=>`
    <div class="step-chip ${s.n===state.wizardStep?'current':''} ${s.n<state.wizardStep?'complete':''}" data-wizard-step="${s.n}">
      <div class="n">${s.n<state.wizardStep?'✓':s.n}</div>
      <div><div class="t">${esc(s.t)}</div><div class="s">${s.n===state.wizardStep?'กำลังทำ':(s.n<state.wizardStep?'เสร็จสิ้น':'ยังไม่ถึง')}</div></div>
    </div>`).join('');

  const step1 = `
    <div class="grid-4" style="grid-template-columns:repeat(4,1fr); gap:14px;">
      <div class="field"><label>RF No<span class="req">*</span></label><input type="text" placeholder="เช่น RF-B010"></div>
      <div class="field"><label>วันที่รับ<span class="req">*</span></label><input type="date"></div>
      <div class="field"><label>ลูกค้า<span class="req">*</span></label>
        <select><option>เลือกลูกค้า</option>${CUSTOMERS.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>ชนิดหลอม<span class="req">*</span></label><select><option>ทอง</option><option>เงิน</option></select></div>
      <div class="field"><label>น้ำหนักแจ้ง (g)<span class="req">*</span></label><input class="num-input" type="text" placeholder="0.00"></div>
      <div class="field"><label>น้ำหนักรับ (g)<span class="req">*</span></label><input class="num-input" type="text" placeholder="0.00"></div>
      <div class="field"><label>ขาด/เกิน (auto)</label><input class="num-input input-locked" type="text" value="0.00" disabled></div>
      <div class="field"><label>รูปแบบ<span class="req">*</span></label><select><option>แบบแท่ง</option><option>แบบเม็ด</option></select></div>
    </div>
    <div class="field" style="margin-top:14px;"><label>รายละเอียด</label><input type="text" placeholder="หมายเหตุเพิ่มเติม (ถ้ามี)"></div>
  `;
  const placeholderStep = (label)=>`<div style="padding:50px 0; text-align:center; color:var(--text-secondary);">
      <div style="font-size:16px;">ขั้นตอน "${esc(label)}" จะเปิดใช้งานหลังจากบันทึกสเตปก่อนหน้า</div>
    </div>`;

  const body = state.wizardStep===1 ? step1
    : state.wizardStep===2 ? placeholderStep('ส่งหลอม')
    : state.wizardStep===3 ? placeholderStep('ทดสอบ %')
    : state.wizardStep===4 ? placeholderStep('คิดค่าใช้จ่าย (หักทอง)')
    : placeholderStep('ส่งให้ TDC');

  return `
    <div class="modal modal-lg">
      <div class="modal-head">
        <h3>สร้าง Order</h3>
        <button class="modal-close" data-close-modal>${iconX()}</button>
      </div>
      <div class="modal-body">
        <div class="stepper">${chips}</div>
        <div class="card card-pad">
          <div style="font-weight:700; font-size:16px; margin-bottom:14px; display:flex; align-items:center; gap:8px;">
            <span style="width:22px;height:22px;border-radius:50%;background:var(--btn-primary);color:var(--fg-on-dark);display:inline-flex;align-items:center;justify-content:center;font-size:16px;">${state.wizardStep}</span>
            ${esc(steps[state.wizardStep-1].t)}
          </div>
          ${body}
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close-modal>ยกเลิก</button>
        <button class="btn btn-secondary" data-action="wizard-save">บันทึก</button>
        <button class="btn btn-primary" data-action="wizard-send">ส่งหลอม</button>
      </div>
    </div>`;
}
