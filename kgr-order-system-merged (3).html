/* ============================================================
   STOCK
   ============================================================ */
function pageStock(){
  const PREP_STATIONS = [4,5,6,7]; // หักทองเสร็จสิ้น (4) จนถึงก่อนเริ่มหลอม 99 (ก่อน 8)
  const DONE_STATIONS_MIN = 9;      // ปิดสถานีหลอม 99 (9) เป็นต้นไป

  const active = ORDERS.filter(o=>!o.cancelled);
  const prepList = active.filter(o=>PREP_STATIONS.includes(o.station));
  const doneList = active.filter(o=>o.station >= DONE_STATIONS_MIN);

  function aggregate(list){
    const sum = (key)=> wfFmt(list.reduce((s,o)=>s+wfNum(o[key]), 0));
    return {
      receivedTotal: sum('w'), meltedTotal: sum('meltedW'),
      au: sum('auCalc'), auBack: sum('auReturn'),
      ag: sum('agCalc'), agBack: sum('agReturn'),
    };
  }
  const prepStats = aggregate(prepList);
  const doneStats = aggregate(doneList);

  const statBlock = (title, stats)=>`
    <div class="card card-pad" style="flex:1;">
      <div class="section-label">${esc(title)}</div>
      <div class="grid-2" style="margin-bottom:14px;">
        <div class="stat-card"><div class="label">ผลรวมน้ำหนักได้รับ</div><div class="value num">${stats.receivedTotal}<span class="unit">g</span></div></div>
        <div class="stat-card"><div class="label">ผลรวมน้ำหนักหลังหลอม</div><div class="value num">${stats.meltedTotal}<span class="unit">g</span></div></div>
      </div>
      <div class="grid-2">
        <div>
          <div class="cell-sub" style="margin-bottom:6px; font-weight:700; color:var(--text-primary);">ทองคำ (Au)</div>
          <div class="total-row"><span>น้ำหนักที่คำนวณได้ (g)</span><span class="num">${stats.au}</span></div>
          <div class="total-row"><span>น้ำหนักคืน (Au) (g)</span><span class="num">${stats.auBack}</span></div>
        </div>
        <div>
          <div class="cell-sub" style="margin-bottom:6px; font-weight:700; color:var(--text-primary);">เงิน (Ag)</div>
          <div class="total-row"><span>น้ำหนักที่คำนวณได้ (g)</span><span class="num">${stats.ag}</span></div>
          <div class="total-row"><span>น้ำหนักคืน (Ag) (g)</span><span class="num">${stats.agBack}</span></div>
        </div>
      </div>
    </div>`;

  const stockList = state.stockTab==='done' ? doneList : prepList;
  const rows = stockList.map(o=>`
    <tr class="clickable" data-detail="${esc(o.rf)}">
      <td class="cell-primary">${esc(o.rf)}</td>
      <td>${esc(o.cust)}</td>
      <td>${esc(o.lotNo||'—')}</td>
      <td>${esc(o.date)}</td>
      <td><span class="badge badge-${o.status}">${esc(o.statusLabel)}</span></td>
      <td class="num">${esc(o.w)} g</td>
    </tr>`).join('');

  return `
    <div class="page-head">
      <div><h1>คลังสินค้า</h1><div class="desc">สรุปสต็อกทองคำ/เงิน แบบ Real-time ตามขั้นตอนที่ใบงานกำลังดำเนินอยู่จริง</div></div>
    </div>

    <div class="search-row" style="margin-bottom:18px;">
      <input type="text" placeholder="01/08/2569 – 31/08/2569" style="max-width:220px;">
      <button class="btn btn-secondary" data-action="manual-search">${iconSearch()} ค้นหา</button>
      <span class="search-hint">${iconInfo()} เลือกช่วงวันที่แล้วกดค้นหาเพื่อโหลดข้อมูล</span>
    </div>

    <div style="display:flex; gap:16px; margin-bottom:22px; flex-wrap:wrap;">
      ${statBlock('Stock จัดเตรียม (ยังไม่สกัด — ผ่านหักทองแล้ว ก่อนเริ่มหลอม 99)', prepStats)}
      ${statBlock('Stock ที่เสร็จสิ้นกระบวนการแล้ว (ปิดสถานีหลอม 99)', doneStats)}
    </div>

    <div class="tabs">
      <div class="tab ${state.stockTab==='prep'?'active':''}" data-tab="stock" data-key="prep">จัดเตรียม<span class="count">${prepList.length}</span></div>
      <div class="tab ${state.stockTab==='done'?'active':''}" data-tab="stock" data-key="done">เสร็จสิ้น<span class="count">${doneList.length}</span></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>RF-No</th><th>ชื่อลูกค้า</th><th>Lot</th><th>วันที่</th><th>สถานะ</th><th class="num">น้ำหนักได้รับ</th></tr></thead>
        <tbody>${rows || `<tr class="empty-row"><td colspan="6">ไม่มีรายการในสถานะนี้</td></tr>`}</tbody>
      </table>
      <div class="table-foot"><span>ทั้งหมด ${stockList.length} รายการ</span><div class="pager"><button>‹</button><button class="active">1</button><button>›</button></div></div>
    </div>
  `;
}

    const parts = String(no||'0/0').split('/').map(x=>parseInt(x,10)||0);
    return (parts[0]||0)*10000 + (parts[1]||0);
  }
  const sortedNoNumber = INV_NO_NUMBER.slice().sort((a,b)=> wfParseThaiDate(b.date) - wfParseThaiDate(a.date));
  const sortedWithNumber = INV_WITH_NUMBER.slice().sort((a,b)=> invNoSortKey(b.no) - invNoSortKey(a.no));

  const tabs = [
    {key:'nonum', label:'RF ที่ยังไม่มีเลข Invoice', count:INV_NO_NUMBER.length},
    {key:'withnum', label:'RF ที่มีเลข Invoice', count:INV_WITH_NUMBER.length},
    {key:'general', label:'Invoice ทั่วไป', count:INV_GENERAL.length},

            <button class="btn btn-secondary btn-sm" data-action="preview-invoice" data-no="${esc(r.no)}">${iconEye()} Preview</button>

  } else {

    let sum = 0;
    for(let i=0;i<key.length;i++) sum += key.charCodeAt(i);
    docType = DOC_TYPES[sum % DOC_TYPES.length];

}

  position:sticky; top:0; background:var(--header-bg); color:#fff; padding:12px 20px;

function genericDetailModal(rf){
  const step = state.detailStep || 1;
  const chips = RF_DETAIL_STEPS.map(s=>{
    const cls = s.n===step ? 'current' : s.n<step ? 'complete' : '';
    const statusText = s.n===step ? 'กำลังทำ' : s.n<step ? 'เสร็จแล้ว' : 'ยังไม่ถึง';
    return `<div class="step-chip ${cls}" data-detail-step="${s.n}">
      <div class="n">${s.n<step ? iconCheckSm() : s.n}</div>
      <div><div class="t">${esc(s.t)}</div><div class="s">${esc(statusText)}</div></div>
    </div>`;
  }).join('');

  const currentLabel = RF_DETAIL_STEPS.find(s=>s.n===step)?.t || '';
  const isLast = step >= RF_DETAIL_STEPS.length;

  return `
    <div class="modal modal-lg">
      <div class="modal-head"><h3>รายละเอียดงาน · ${esc(rf)}</h3><button class="modal-close" data-close-modal>${iconX()}</button></div>
      <div class="modal-body">
        <div class="stepper" style="margin-bottom:20px;">${chips}</div>

        <div class="grid-2" style="gap:16px; margin-bottom:16px;">
          <div class="field"><label>RF No</label><input type="text" value="${esc(rf)}" class="input-locked" disabled></div>
          <div class="field"><label>ขั้นตอนปัจจุบัน</label><input type="text" value="${esc(currentLabel)}" class="input-locked" disabled></div>
        </div>

        <div class="grid-2" style="gap:16px; margin-bottom:16px;">
          <div class="field"><label>% Au (ทอง)</label><input class="num-input" type="text" placeholder="0.00" value="96.50"></div>
          <div class="field"><label>% Ag (เงิน)</label><input class="num-input" type="text" placeholder="0.00" value="2.10"></div>
        </div>

        <div class="field" style="margin-bottom:16px;"><label>น้ำหนักทอง (g)</label><input class="num-input" type="text" placeholder="0.00" value="100.00"></div>
        <div class="field" style="margin-bottom:16px;"><label>หมายเหตุ</label><input type="text" placeholder="บันทึกหมายเหตุขั้นตอนนี้ (ไม่บังคับ)"></div>

        <div class="divider"></div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" data-action="goto-history">${iconClock()} ดูประวัติการใช้งานและการแก้ไข (Audit Log)</button>
          <button class="btn btn-ghost btn-sm" data-action="export-excel-rf" data-rf="${esc(rf)}">${iconDownload()} Export Excel</button>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close-modal>ปิด</button>
        <button class="btn btn-secondary" data-action="save-detail-step" data-rf="${esc(rf)}">บันทึก</button>
        <button class="btn btn-primary" data-action="advance-detail-step" data-rf="${esc(rf)}" ${isLast?'disabled':''}>${isLast ? 'เสร็จสิ้นขั้นตอนทั้งหมด' : 'บันทึก / ส่งต่อขั้นตอนถัดไป →'}</button>
      </div>
    </div>`;
}

function docBadge(type){
  const map = {
    original: {label:'ต้นฉบับ', cls:'doc-original'},
    copy1:    {label:'สำเนาใบที่ 1', cls:'doc-copy1'},
    copy2:    {label:'สำเนาใบที่ 2', cls:'doc-copy2'},
  };

  return `<span class="doc-badge ${d.cls}">${d.label}</span>`;
}

function bindPageEvents(){
  // tabs
  $$('[data-tab]').forEach(el=>el.addEventListener('click', ()=>{
    const group = el.dataset.tab, key = el.dataset.key;
    if(group==='order') state.orderTab = key;
    if(group==='lot') state.lotStage = key;
    if(group==='acct') state.acctTab = key;
    if(group==='stock') state.stockTab = key;
    renderPage();
  }));

  // nav-to-page buttons
  $$('[data-go]').forEach(el=>el.addEventListener('click', ()=>goPage(el.dataset.go)));

  // RF read-only summary (from การจัดล็อต — review history without editing)
  $$('[data-rf-summary]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    state.rfSummaryTarget = el.dataset.rfSummary;
    state.page = 'rf-summary';
    renderSidebar(); renderBreadcrumb(); renderPage();
    window.scrollTo({top:0,behavior:'instant'});
  }));
  const rfSummaryBack = $('#wf_rfSummaryBack');
  if(rfSummaryBack) rfSummaryBack.addEventListener('click', ()=>{
    state.page = 'lot-allocate'; // preserves state.lotAllocateView (bar/pellet) — unlike goPage()
    renderSidebar(); renderBreadcrumb(); renderPage();
  });

  // detail rows/cards — open the 10-Station Workflow
  $$('[data-detail]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const rf = el.dataset.detail;
    const lotStation = el.dataset.lotStation ? parseInt(el.dataset.lotStation) : null;
    const existing = ORDERS.find(o=>o.rf === rf);
    order = wfFreshOrder(rf);
    if(lotStation){
      // Entry from "จัดการข้อมูลล็อต" — jump straight into Station 5-9, stepper shows only 5-9
      order.station1.customerName = el.dataset.lotCust || '';
      order.station1.receiveDate = el.dataset.lotDate || todayStr();
      order.station1.receivedWeight = wfNum(el.dataset.lotW);
      order.station1.declaredWeight = wfNum(el.dataset.lotW);
      order.lotNo = el.dataset.lotNo || null;
      order.jobType = el.dataset.lotJobtype || 'bar';
      order.station1.jobFormat = order.jobType;
      state.wfCurrent = lotStation;
      state.wfMaxUnlocked = lotStation;
      state.wfStepperLimit = null;
      state.wfStepperRange = [5,9];
    } else if(existing){
      order.station1.customerName = existing.cust || '';
      order.station1.receiveDate = existing.date || todayStr();
      order.station1.receivedWeight = wfNum(existing.w);
      order.station1.declaredWeight = wfNum(existing.w);
      order.station1.diffWeight = WfFormula.diffWeight(order.station1.declaredWeight, order.station1.receivedWeight);
      order.station3.percentAu = existing.percentAu ?? null;
      order.station3.percentAg = existing.percentAg ?? null;
      order.percentApproval.status = existing.percentApprovalStatus || 'none';
      state.wfCurrent = existing.station || 1;
      state.wfMaxUnlocked = existing.station || 1;
      state.wfStepperLimit = (state.wfCurrent <= 4) ? 4 : null;
      state.wfStepperRange = null;
    } else {
      state.wfCurrent = 1; state.wfMaxUnlocked = 1;
      state.wfStepperLimit = 4;

    goPage('workflow');

/* ---------- Numeric-only input lock for all weight/number fields (.num-input) ---------- */
function wfNumericKeyGuard(e){
  const navKeys = ['Backspace','Delete','Tab','Escape','Enter','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'];
  if(navKeys.includes(e.key)) return;
  if(e.ctrlKey || e.metaKey) return; // allow copy/paste/select-all shortcuts
  if(e.key === '.'){
    if(e.target.value.includes('.')) e.preventDefault(); // only one decimal point allowed
    return;
  }
  if(!/^[0-9]$/.test(e.key)) e.preventDefault(); // block letters, symbols, spacebar, Thai/English text
}
document.addEventListener('keydown', (e)=>{
  if(e.target && e.target.classList && e.target.classList.contains('num-input')) wfNumericKeyGuard(e);
});
document.addEventListener('input', (e)=>{
  const el = e.target;
  if(!(el && el.classList && el.classList.contains('num-input'))) return;
  let v = el.value.replace(/[^0-9.]/g, ''); // strip anything pasted/IME-typed that isn't digit/dot
  const firstDot = v.indexOf('.');
  if(firstDot !== -1) v = v.slice(0, firstDot+1) + v.slice(firstDot+1).replace(/\./g, '');
  if(v !== el.value){
    const pos = el.selectionStart - (el.value.length - v.length);
    el.value = v;
    try{ el.setSelectionRange(pos, pos); }catch(_){}
  }
});
/* Auto-apply inputmode="decimal" (big numeric keypad on mobile/tablet) to every .num-input, present or future */
(function(){
  function applyDecimalMode(root){
    (root.querySelectorAll ? root : document).querySelectorAll('.num-input:not([inputmode])').forEach(el=>{
      el.setAttribute('inputmode','decimal');
    });
  }
  applyDecimalMode(document);
  new MutationObserver(()=>applyDecimalMode(document)).observe(document.body, {childList:true, subtree:true});
})();

/* ---------- Minimal-accent rule: colour ONLY the ขาด/เกิน diff field ---------- */
function wfPaintDiffField(el, isMatch){
  if(!el) return;
  el.classList.remove('diff-match','diff-mismatch');
  el.classList.add(isMatch ? 'diff-match' : 'diff-mismatch');
}


document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter') return;
  const el = e.target;
  const tag = el.tagName;
  if(tag !== 'INPUT' && tag !== 'SELECT') return;
  if(tag === 'INPUT' && (el.type === 'checkbox' || el.type === 'radio')) return;
  e.preventDefault();
  const container = el.closest('.modal, .content, body') || document.body;
  const focusable = Array.from(container.querySelectorAll(
    'input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled])'
  )).filter(f => f.offsetParent !== null); // only visible fields
  const idx = focusable.indexOf(el);
  if(idx > -1 && idx < focusable.length - 1){
    focusable[idx + 1].focus();
    if(focusable[idx + 1].select) { try{ focusable[idx + 1].select(); }catch(_){} }
  }
});

/* ---------- Mobile sidebar drawer ---------- */
(function(){
  const btn = document.getElementById('menuToggle');
  const sidebar = document.getElementById('appSidebar');
  const scrim = document.getElementById('sidebarScrim');
  if(!btn || !sidebar || !scrim) return;
  function closeDrawer(){
    sidebar.classList.remove('open');
    scrim.classList.remove('open');
    btn.setAttribute('aria-expanded','false');
  }
  function openDrawer(){
    sidebar.classList.add('open');
    scrim.classList.add('open');
    btn.setAttribute('aria-expanded','true');
  }
  btn.addEventListener('click', ()=> sidebar.classList.contains('open') ? closeDrawer() : openDrawer());
  scrim.addEventListener('click', closeDrawer);
  sidebar.addEventListener('click', (e)=>{
    if(e.target.closest('.nav-item') && window.matchMedia('(max-width:768px)').matches) closeDrawer();
  });
  window.addEventListener('resize', ()=>{ if(window.innerWidth > 768) closeDrawer(); });
})();
</script>
</body>
</html>
